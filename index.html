<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>RYG Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
:root {
  --g: #1D9E75; --gd: #0F6E56; --gl: #E1F5EE; --gll: #F0FAF6;
  --b: #185FA5; --bl: #E6F1FB;
  --am: #7A4400; --aml: #FFF0DC;
  --r: #C0392B; --rl: #FDECEA;
  --pu: #5B3DC8; --pul: #EEEAFF;
  --bg: #F2F4F7; --surf: #fff;
  --bdr: rgba(0,0,0,0.08); --bdrm: rgba(0,0,0,0.15);
  --tx: #111; --tx2: #555; --tx3: #999;
  --rad: 10px; --radlg: 14px; --radsm: 6px;
  --font: 'Sarabun','Segoe UI',sans-serif;
  --mono: 'IBM Plex Mono',monospace;
  --nav-h: 60px;  /* bottom nav height on mobile */
  --top-h: 52px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:14px;overflow-x:hidden;}

/* ══════════════════════════════════════
   LOADING
══════════════════════════════════════ */
#loadingScreen{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px;}
.spinner{width:36px;height:36px;border:3px solid var(--gl);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ══════════════════════════════════════
   LOGIN
══════════════════════════════════════ */
#loginScreen{min-height:100vh;display:none;align-items:center;justify-content:center;background:linear-gradient(150deg,#0a5c45,#1D9E75 55%,#64d4aa);}
.login-card{background:#fff;border-radius:20px;padding:2.2rem;width:340px;max-width:90vw;box-shadow:0 24px 64px rgba(0,0,0,.18);}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:1.8rem;}
.logo-box{width:44px;height:44px;background:var(--g);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.login-card h1{font-size:18px;font-weight:700;}
.login-card p{font-size:12px;color:var(--tx3);}
.btn-google{width:100%;padding:11px;border:1.5px solid var(--bdrm);border-radius:var(--rad);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:600;color:var(--tx);font-family:var(--font);transition:background .15s;}
.btn-google:hover{background:#f5f5f5;}
.login-note{font-size:11px;color:var(--tx3);text-align:center;margin-top:.9rem;line-height:1.6;}

/* ══════════════════════════════════════
   APP SHELL
══════════════════════════════════════ */
#mainApp{display:none;flex-direction:column;min-height:100vh;}

/* TOP BAR */
.topbar{background:var(--surf);border-bottom:1px solid var(--bdr);height:var(--top-h);display:flex;align-items:center;padding:0 1rem;position:sticky;top:0;z-index:100;gap:10px;}
.topbar-logo{width:30px;height:30px;background:var(--g);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.topbar-title{font-size:15px;font-weight:700;flex:1;}
.user-mini{display:flex;align-items:center;gap:7px;}
.user-ava{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--gd);flex-shrink:0;}
.user-name-top{font-size:12px;font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge-role{padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;}
.badge-admin{background:var(--gl);color:var(--gd);}
.badge-user{background:var(--bl);color:var(--b);}
.btn-topout{padding:5px 10px;border:1px solid var(--bdrm);border-radius:var(--radsm);background:transparent;cursor:pointer;font-size:12px;color:var(--tx2);font-family:var(--font);}

/* DESKTOP NAV TABS */
.nav-tabs{background:var(--surf);border-bottom:1px solid var(--bdr);padding:0 1rem;display:flex;overflow-x:auto;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{padding:10px 14px;font-size:13px;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0;}
.nav-tab.active{color:var(--g);border-bottom-color:var(--g);font-weight:700;}

/* CONTENT */
.content{padding:1rem;flex:1;padding-bottom:calc(var(--nav-h) + 1rem);}
@media(min-width:768px){.content{padding:1.25rem;padding-bottom:1.25rem;}}

/* MOBILE BOTTOM NAV */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--surf);border-top:1px solid var(--bdr);z-index:100;align-items:stretch;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--tx3);font-size:10px;font-weight:500;padding:6px 2px;min-width:0;}
.bnav-item .ico{font-size:19px;line-height:1;}
.bnav-item.active{color:var(--g);}
.bnav-item.active .ico{transform:scale(1.1);}
@media(max-width:767px){
  .nav-tabs{display:none;}
  .bottom-nav{display:flex;}
}

/* ══════════════════════════════════════
   STAT CARDS
══════════════════════════════════════ */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem;}
@media(min-width:600px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--radlg);padding:1rem;}
.stat-label{font-size:11px;color:var(--tx2);margin-bottom:4px;}
.stat-value{font-size:24px;font-weight:700;line-height:1.1;}
.stat-sub{font-size:10px;color:var(--tx3);margin-top:2px;}

/* ══════════════════════════════════════
   CARDS
══════════════════════════════════════ */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--radlg);overflow:hidden;}
.card-header{padding:.85rem 1rem;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.card-title{font-size:13px;font-weight:700;}
.section-gap{margin-bottom:1rem;}

/* ══════════════════════════════════════
   CATEGORY GROUP (accordion)
══════════════════════════════════════ */
.cat-group{margin-bottom:.75rem;}
.cat-header{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rad);padding:.7rem 1rem;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;transition:background .15s;}
.cat-header:hover{background:var(--gll);}
.cat-header.open{border-radius:var(--rad) var(--rad) 0 0;border-bottom-color:transparent;}
.cat-icon{font-size:18px;width:28px;text-align:center;flex-shrink:0;}
.cat-name{font-size:14px;font-weight:700;flex:1;}
.cat-count{font-size:12px;color:var(--tx3);}
.cat-counts{display:flex;gap:6px;align-items:center;}
.cat-arrow{font-size:11px;color:var(--tx3);transition:transform .2s;flex-shrink:0;}
.cat-header.open .cat-arrow{transform:rotate(180deg);}
.cat-body{display:none;border:1px solid var(--bdr);border-top:none;border-radius:0 0 var(--rad) var(--rad);overflow:hidden;}
.cat-body.open{display:block;}

/* Item rows inside category */
.item-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:.7rem 1rem;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .12s;}
.item-row:last-child{border-bottom:none;}
.item-row:hover,.item-row:active{background:var(--gll);}
.item-row.expanded{background:var(--gll);}
.item-code{font-family:var(--mono);font-size:10px;color:var(--tx3);}
.item-name{font-size:13px;font-weight:600;line-height:1.3;}
.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.qty-pill{font-size:13px;font-weight:700;color:var(--tx);}

/* Item expand detail */
.item-expand{display:none;background:#F7FBF9;border-top:1px solid var(--bdr);padding:.9rem 1rem;}
.item-expand.open{display:block;}

/* Unit cards inside expand */
.units-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:.7rem;}
.unit-card{background:#fff;border:1px solid var(--bdr);border-radius:var(--radsm);padding:.7rem .85rem;display:flex;gap:10px;align-items:flex-start;}
.unit-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.dot-available{background:#1D9E75;}
.dot-used{background:#aaa;}
.dot-damaged{background:#E5A600;}
.unit-info{flex:1;min-width:0;}
.unit-sn{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--pu);background:var(--pul);padding:2px 7px;border-radius:4px;display:inline-block;margin-bottom:3px;}
.unit-nosn{font-family:var(--mono);font-size:10px;color:var(--tx3);background:#F0F0F0;padding:2px 7px;border-radius:4px;display:inline-block;margin-bottom:3px;}
.unit-detail{font-size:11px;color:var(--tx2);line-height:1.4;}
.unit-note{font-size:11px;color:var(--am);margin-top:2px;}
.unit-loc{font-size:11px;color:var(--tx3);}
.unit-actions{display:flex;gap:4px;flex-shrink:0;}

/* ══════════════════════════════════════
   BADGES
══════════════════════════════════════ */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;line-height:1.4;}
.badge-ok{background:var(--gl);color:var(--gd);}
.badge-low{background:var(--aml);color:var(--am);}
.badge-out{background:var(--rl);color:var(--r);}
.badge-in{background:var(--gl);color:var(--gd);}
.badge-out2{background:var(--rl);color:var(--r);}
.badge-avail{background:var(--gl);color:var(--gd);}
.badge-used2{background:#F0F0F0;color:#777;}
.badge-dmg{background:var(--aml);color:var(--am);}
.badge-sn{background:var(--pul);color:var(--pu);font-family:var(--mono);}

/* ══════════════════════════════════════
   BUTTONS
══════════════════════════════════════ */
.btn{padding:7px 13px;border-radius:var(--rad);font-size:13px;cursor:pointer;border:1px solid var(--bdrm);background:var(--surf);color:var(--tx2);display:inline-flex;align-items:center;gap:5px;font-family:var(--font);line-height:1;transition:background .12s;}
.btn:hover{background:var(--bg);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--g);color:#fff;border-color:var(--g);}
.btn-primary:hover{background:var(--gd);}
.btn-danger{background:var(--rl);color:var(--r);border-color:#F0A0A0;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-icon{padding:5px 7px;border-radius:var(--radsm);}
.btn-full{width:100%;justify-content:center;}

/* ══════════════════════════════════════
   FORM
══════════════════════════════════════ */
.field{margin-bottom:.85rem;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:4px;letter-spacing:.3px;}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--bdrm);border-radius:var(--rad);font-size:13px;font-family:var(--font);background:var(--surf);color:var(--tx);}
.field textarea{resize:vertical;min-height:64px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(29,158,117,.12);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:480px){.grid-2{grid-template-columns:1fr;}}

/* ══════════════════════════════════════
   MODAL
══════════════════════════════════════ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:300;}
@media(min-width:600px){.modal-overlay{align-items:center;}}
.modal{background:var(--surf);border-radius:20px 20px 0 0;padding:1.5rem;width:100%;max-width:100vw;max-height:92vh;overflow-y:auto;}
@media(min-width:600px){.modal{border-radius:var(--radlg);width:540px;max-height:88vh;}}
.modal-lg{max-width:100vw;}
@media(min-width:700px){.modal-lg{width:680px;}}
.modal-title{font-size:15px;font-weight:700;margin-bottom:1.1rem;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--bdr);}
.modal-handle{width:36px;height:4px;background:var(--bdrm);border-radius:4px;margin:0 auto 1rem;}

/* ══════════════════════════════════════
   QR PANEL
══════════════════════════════════════ */
.qr-wrap{max-width:480px;margin:0 auto;}
.qr-box{width:180px;height:180px;border:2px dashed var(--bdrm);border-radius:var(--radlg);margin:1.2rem auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--tx3);font-size:12px;position:relative;overflow:hidden;transition:border-color .2s;}
.qr-box:hover{border-color:var(--g);color:var(--g);}
.scan-line{position:absolute;top:0;left:0;right:0;height:3px;background:var(--g);animation:scanAnim 1.8s ease-in-out infinite;}
@keyframes scanAnim{0%{top:0}50%{top:calc(100% - 3px)}100%{top:0}}
.qr-result{background:var(--bg);border-radius:var(--rad);padding:.9rem 1rem;margin:.9rem 0;}
.res-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.res-lbl{font-size:11px;color:var(--tx3);}
.res-val{font-size:13px;font-weight:600;}
.op-tabs{display:flex;gap:8px;margin:.9rem 0;}
.op-tab{flex:1;padding:10px;border:1px solid var(--bdrm);border-radius:var(--rad);cursor:pointer;font-size:13px;font-weight:600;text-align:center;color:var(--tx2);background:var(--bg);font-family:var(--font);}
.op-tab.active{background:var(--g);border-color:var(--g);color:#fff;}

/* ══════════════════════════════════════
   WITHDRAW
══════════════════════════════════════ */
.service-ref{background:var(--gl);border-radius:var(--rad);padding:.7rem 1rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;}
.service-ref-no{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--gd);}
.service-ref-lbl{font-size:11px;color:var(--gd);}

/* Unit picker */
.unit-picker{border:1px solid var(--bdrm);border-radius:var(--rad);overflow:hidden;max-height:260px;overflow-y:auto;}
.unit-pick-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--bdr);cursor:pointer;}
.unit-pick-row:last-child{border-bottom:none;}
.unit-pick-row.selected{background:var(--gll);}
.upick-cb{width:17px;height:17px;flex-shrink:0;cursor:pointer;}

/* SN input rows */
.sn-row{display:grid;grid-template-columns:1fr 1.6fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px;}
@media(max-width:520px){.sn-row{grid-template-columns:1fr 1fr;gap:6px;}}
.sn-row input{padding:7px 9px;border:1px solid var(--bdrm);border-radius:var(--radsm);font-size:12px;font-family:var(--mono);width:100%;}
@media(max-width:520px){.sn-row input:nth-child(3){display:none;}}

/* Withdraw list table on mobile → cards */
.wd-list{display:flex;flex-direction:column;gap:6px;}
.wd-item{background:var(--bg);border-radius:var(--rad);padding:.7rem .9rem;display:flex;align-items:center;gap:10px;}
.wd-item-info{flex:1;min-width:0;}
.wd-item-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wd-item-meta{font-size:11px;color:var(--tx3);}

/* Withdraw summary sticky on mobile */
.wd-summary-sticky{position:sticky;bottom:calc(var(--nav-h) + 8px);background:var(--surf);border:1px solid var(--bdr);border-radius:var(--radlg);padding:.9rem 1rem;box-shadow:0 -4px 20px rgba(0,0,0,.07);margin-top:.9rem;}
@media(min-width:768px){.wd-summary-sticky{position:static;box-shadow:none;}}

/* ══════════════════════════════════════
   HISTORY - mobile cards
══════════════════════════════════════ */
.hist-list{display:flex;flex-direction:column;gap:8px;}
.hist-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rad);padding:.8rem 1rem;}
.hist-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.hist-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.hist-item{font-size:13px;font-weight:600;}
.hist-sn{font-family:var(--mono);font-size:11px;color:var(--pu);}
.hist-meta{font-size:11px;color:var(--tx3);line-height:1.6;}
.hist-ref{font-family:var(--mono);font-size:10px;color:var(--tx3);}

/* ══════════════════════════════════════
   SEARCH BAR
══════════════════════════════════════ */
.search-bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.search-input{padding:8px 11px;border:1px solid var(--bdrm);border-radius:var(--rad);font-size:13px;flex:1;min-width:160px;background:var(--surf);font-family:var(--font);}
.search-input:focus{outline:none;border-color:var(--g);}

/* ══════════════════════════════════════
   PRINT
══════════════════════════════════════ */
@media print{
  #mainApp,.topbar,.nav-tabs,.content,.bottom-nav{display:none!important;}
  #printArea{display:block!important;}
}
#printArea{display:none;}
.print-doc{max-width:750px;margin:0 auto;padding:2rem;font-family:'Sarabun',sans-serif;}
.print-header{text-align:center;margin-bottom:1.5rem;border-bottom:2px solid #000;padding-bottom:1rem;}
.print-title{font-size:20px;font-weight:700;}
.print-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:1rem 0;}
.pm-lbl{font-size:11px;color:#666;}
.pm-val{font-size:13px;font-weight:600;}
.print-table{width:100%;border-collapse:collapse;margin-top:1rem;}
.print-table th,.print-table td{border:1px solid #ccc;padding:7px 9px;font-size:12px;}
.print-table th{background:#f0f0f0;font-weight:700;}
.print-sign{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:3rem;}
.sign-box{text-align:center;}
.sign-line{border-top:1px solid #000;margin-top:3rem;padding-top:6px;font-size:12px;}

/* ══════════════════════════════════════
   NOTIF
══════════════════════════════════════ */
#notif{position:fixed;bottom:calc(var(--nav-h) + 12px);left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.2);}
#notif.show{opacity:1;}
#notif.error{background:var(--r);}
@media(min-width:768px){#notif{bottom:24px;}}

/* ══════════════════════════════════════
   UTILS
══════════════════════════════════════ */
.flex{display:flex;} .gap8{gap:8px;} .items-c{align-items:center;} .jb{justify-content:space-between;}
.mono{font-family:var(--mono);} .fw7{font-weight:700;} .fz12{font-size:12px;} .fz11{font-size:11px;}
.txm{color:var(--tx2);} .txmute{color:var(--tx3);}
.bar-bg{background:#E5E7EB;border-radius:4px;height:6px;}
.bar-fill{background:var(--g);height:6px;border-radius:4px;transition:width .4s;}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--tx3);font-size:13px;}
.info-box{background:var(--bl);border-radius:var(--rad);padding:.75rem 1rem;font-size:12px;color:var(--b);margin:.7rem 0;}

/* Dashboard 2-col grid */
.dash-grid{display:grid;grid-template-columns:1fr;gap:1rem;margin-bottom:1rem;}
@media(min-width:640px){.dash-grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loadingScreen">
  <div class="logo-box" style="width:52px;height:52px;font-size:26px;border-radius:14px;">📦</div>
  <div style="font-size:15px;font-weight:700;">RYG Stock System</div>
  <div class="spinner"></div>
</div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-box">📦</div>
      <div><h1>RYG Stock</h1><p>ระบบจัดการ Spare Part</p></div>
    </div>

function subscribeHistory(){
  if(historyUnsub)historyUnsub();

    .onSnapshot(snap=>{
      historyData=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(currentTab==='history')renderHistoryTab();
      if(currentTab==='dashboard')renderDashboardTab();
    });

// ═══════════════════════════════════════════════════
function showTab(tab){
  const a=getTabs().map(t=>t.id);
  if(!a.includes(tab))tab='dashboard';
  currentTab=tab; renderNav();
  if(tab==='dashboard') renderDashboardTab();
  else if(tab==='stock')    renderStockTab();
  else if(tab==='qr')       renderQRTab();
  else if(tab==='withdraw') renderWithdrawTab();
  else if(tab==='history')  renderHistoryTab();
  else if(tab==='users')    renderUsersTab();
  window.scrollTo(0,0);
}

// ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
function getStatus(id){
  const q=getItemQty(id),item=allItems.find(i=>i.id===id);
  if(!item)return'ok';
  if(q<=0)return'out';
  if(q<=item.min)return'low';
  return'ok';
}
function statusBadge(id){
  const s=getStatus(id);
  if(s==='out')return'<span class="badge badge-out">หมดสต็อก</span>';
  if(s==='low')return'<span class="badge badge-low">ใกล้หมด</span>';
  return'<span class="badge badge-ok">ปกติ</span>';
}
function snBadge(u){
  return u.sn?`<span class="badge badge-sn">${u.sn}</span>`:`<span class="unit-nosn">ไม่มี S/N</span>`;
}
function unitStatBadge(s){
  if(s==='used')return'<span class="badge badge-used2">เบิกแล้ว</span>';
  if(s==='damaged')return'<span class="badge badge-dmg">ชำรุด</span>';
  return'<span class="badge badge-avail">พร้อมใช้</span>';
}
function formatDT(ts){
  if(!ts)return'-';
  const d=ts.toDate?ts.toDate():new Date(ts);
  return d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}
function todayStr(){return new Date().toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'});}
function genNo(){
  const d=new Date();
  return'WD-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(Math.floor(Math.random()*9000)+1000);
}

  const topCats=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const maxV=topCats[0]?topCats[0][1]:1;

  document.getElementById('mainContent').innerHTML=`

    <div class="stat-card"><div class="stat-label" style="color:var(--am)">ใกล้หมด</div><div class="stat-value" style="color:var(--am)">${low}</div><div class="stat-sub">รายการ</div></div>
    <div class="stat-card"><div class="stat-label" style="color:var(--r)">หมดสต็อก</div><div class="stat-value" style="color:var(--r)">${out}</div><div class="stat-sub">รายการ</div></div>
  </div>
  <div class="dash-grid">
    <div class="card">
      <div class="card-header"><span class="card-title">สต็อกตามกลุ่ม</span></div>
      <div style="padding:1rem">
        ${topCats.map(([k,v])=>{
          const g=getGroupDef(k);
          return`<div style="margin-bottom:11px">
            <div class="flex jb fz12" style="margin-bottom:4px">
              <span>${g.icon} ${g.label}</span><span class="txmute">${v} ชิ้น</span>
            </div>
            <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(v/maxV*100)}%"></div></div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">ความเคลื่อนไหวล่าสุด</span></div>
      <div style="padding:1rem">
        ${recent.length===0?'<div class="empty-state">ยังไม่มีรายการ</div>':
          recent.map(h=>`<div class="flex gap8 items-c" style="margin-bottom:10px">
            <div class="hist-dot" style="background:${h.type==='in'?'#1D9E75':'#E24B4A'};flex-shrink:0"></div>
            <div style="flex:1;min-width:0">
              <div class="fz12 fw7" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.type==='in'?'นำเข้า':'เบิก'} ${h.itemName}</div>
              <div class="fz11 txmute">${h.userName||''} · ${h.usedAt||''}</div>
            </div>
            <div class="fz11 txmute" style="flex-shrink:0">${formatDT(h.createdAt)}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>
  ${alerts.length>0?`
  <div class="card">
    <div class="card-header"><span class="card-title">⚠️ ต้องจัดการ</span></div>
    <div style="padding:.5rem 0">
      ${alerts.map(i=>`
        <div class="item-row" style="cursor:default" onclick="showTab('stock')">
          <div>
            <div class="item-name">${i.name}</div>
            <div class="item-code">${i.id}</div>
          </div>
          <div class="item-right">
            ${statusBadge(i.id)}
            <span class="fz12 fw7">${getItemQty(i.id)} ชิ้น</span>
          </div>
        </div>`).join('')}
    </div>
  </div>`:''}`;
}

// ═══════════════════════════════════════════════════
// STOCK TAB — category accordion
// ═══════════════════════════════════════════════════
function renderStockTab(){
  const isAdmin=currentRole==='admin';
  const q=searchQ.toLowerCase();
  const filtered=allItems.filter(i=>!q||i.name.toLowerCase().includes(q)||i.id.toLowerCase().includes(q)||(i.cat||'').toLowerCase().includes(q));

  // group filtered items by CAT_GROUPS
  const grouped={};
  filtered.forEach(item=>{
    const k=getGroupKey(item.cat);
    if(!grouped[k])grouped[k]=[];
    grouped[k].push(item);
  });

  let html=`
  <div class="flex jb items-c section-gap">
    <div style="font-size:15px;font-weight:700">สต็อกสินค้า</div>
    <div class="search-bar">
      <input class="search-input" placeholder="ค้นหา..." value="${searchQ}" oninput="searchQ=this.value;renderStockTab()"/>
      ${isAdmin?`<button class="btn btn-primary btn-sm" onclick="openAddItem()">+ เพิ่ม</button>`:''}
    </div>
  </div>`;

  // open all groups that have search results
  if(q){Object.keys(grouped).forEach(k=>{openCats[k]=true;});}

  CAT_GROUPS.forEach(grp=>{
    const items=grouped[grp.key];
    if(!items||!items.length)return;
    const isOpen=openCats[grp.key]!==false; // default open
    const totalQty=items.reduce((a,i)=>a+getItemQty(i.id),0);
    const outCnt=items.filter(i=>getStatus(i.id)==='out').length;
    const lowCnt=items.filter(i=>getStatus(i.id)==='low').length;

    html+=`
    <div class="cat-group">
      <div class="cat-header ${isOpen?'open':''}" onclick="toggleCat('${grp.key}')">
        <span class="cat-icon">${grp.icon}</span>
        <span class="cat-name">${grp.label}</span>
        <div class="cat-counts">
          <span class="cat-count">${items.length} รายการ · ${totalQty} ชิ้น</span>
          ${outCnt?`<span class="badge badge-out">${outCnt} หมด</span>`:''}
          ${lowCnt?`<span class="badge badge-low">${lowCnt} ใกล้หมด</span>`:''}
        </div>
        <span class="cat-arrow">▼</span>
      </div>
      <div class="cat-body ${isOpen?'open':''}" id="catbody-${grp.key}">
        ${items.map(item=>renderItemRow(item,isAdmin)).join('')}
      </div>
    </div>`;
  });

function snRowHTML(u,i){
  return`<div class="sn-row" id="srow-${i}">
    <input placeholder="S/N" value="${u.sn||''}" oninput="pendingUnits[${i}].sn=this.value"/>
    <input placeholder="รายละเอียด เช่น 2TB SATA" value="${u.detail||''}" oninput="pendingUnits[${i}].detail=this.value"/>
    <input placeholder="หมายเหตุ" value="${u.note||''}" oninput="pendingUnits[${i}].note=this.value"/>
    <button class="btn btn-icon btn-sm btn-danger" onclick="removePendingRow(${i})">✕</button>
  </div>`;
}
function addPendingRow(itemId){
  pendingUnits.push({sn:'',detail:'',note:''});
  document.getElementById('pendingList').innerHTML=pendingUnits.map((u,i)=>snRowHTML(u,i)).join('');
  const b=document.getElementById('savePendingBtn');
  if(b)b.textContent=`💾 บันทึก ${pendingUnits.length} ชิ้น`;
}
function removePendingRow(idx){
  if(pendingUnits.length===1){showNotif('ต้องมีอย่างน้อย 1 แถว','error');return;}
  pendingUnits.splice(idx,1);
  document.getElementById('pendingList').innerHTML=pendingUnits.map((u,i)=>snRowHTML(u,i)).join('');
}
async function doSaveUnits(itemId){
  const item=allItems.find(i=>i.id===itemId);
  // collect latest DOM values
  pendingUnits.forEach((u,i)=>{
    const row=document.getElementById(`srow-${i}`);
    if(row){const inp=row.querySelectorAll('input');u.sn=inp[0].value.trim();u.detail=inp[1].value.trim();u.note=inp[2].value.trim();}
  });
  const batch=db.batch();
  pendingUnits.forEach(u=>{
    batch.set(db.collection('units').doc(),{
      itemId,sn:u.sn,detail:u.detail,note:u.note,status:'available',
      addedAt:firebase.firestore.FieldValue.serverTimestamp(),
      addedBy:currentUser.displayName,addedByUid:currentUser.uid
    });
  });
  batch.set(db.collection('transactions').doc(),{
    type:'in',itemId,itemName:item.name,qty:pendingUnits.length,
    sn:pendingUnits.map(u=>u.sn).filter(Boolean).join(', '),
    userId:currentUser.uid,userEmail:currentUser.email,userName:currentUser.displayName,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),source:'manual'
  });
  await batch.commit();
  const snap=await db.collection('units').where('itemId','==',itemId).get();
  allUnits=allUnits.filter(u=>u.itemId!==itemId).concat(snap.docs.map(d=>({docId:d.id,...d.data()})));
  closeModal(); showNotif(`เพิ่ม ${pendingUnits.length} ชิ้นสำเร็จ`); renderStockTab();
}

function simulateScan(){
  if(scanStep!==0)return;
  scanStep=1;renderQRTab();
  setTimeout(()=>{scannedItem=allItems[Math.floor(Math.random()*allItems.length)];scanStep=2;qrSelectedUnits=[];renderQRTab();},1400);
}
function quickScan(id){if(!id)return;scannedItem=allItems.find(i=>i.id===id);scanStep=2;qrSelectedUnits=[];renderQRTab();}
function setScanOp(op){scanOp=op;renderQRTab();}
function resetScan(){scanStep=0;scannedItem=null;qrSelectedUnits=[];renderQRTab();}

async function doQROp(){
  const cbs=[...document.querySelectorAll('.upick-cb:checked')];
  if(!cbs.length){showNotif('เลือกอย่างน้อย 1 ชิ้น','error');return;}
  const usedAt=document.getElementById('qrUAt')?.value||'';
  const note=document.getElementById('qrNote')?.value||'';
  const svcNo=genNo();
  const batch=db.batch();
  cbs.forEach(cb=>{
    const uid=cb.value;
    const u=allUnits.find(x=>x.docId===uid);
    batch.update(db.collection('units').doc(uid),{status:'used',usedAtLabel:usedAt,usedAt:firebase.firestore.FieldValue.serverTimestamp(),usedBy:currentUser.displayName,usedTxId:svcNo});
    batch.set(db.collection('transactions').doc(),{
      type:'out',serviceNo:svcNo,itemId:scannedItem.id,itemName:scannedItem.name,qty:1,
      sn:u?.sn||'',unitId:uid,detail:u?.detail||'',usedAt,note,source:'qr_scan',
      userId:currentUser.uid,userEmail:currentUser.email,userName:currentUser.displayName,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  });
  await batch.commit();
  cbs.forEach(cb=>{const u=allUnits.find(x=>x.docId===cb.value);if(u){u.status='used';u.usedAtLabel=usedAt;}});
  showNotif(`เบิก ${cbs.length} ชิ้นสำเร็จ`);resetScan();
}

  ${withdrawUnits.length>0?`
  <div class="card" style="margin-bottom:1rem">
    <div class="card-header"><span class="card-title">รายการที่จะเบิก (${withdrawUnits.length} ชิ้น)</span></div>
    <div style="padding:.75rem 1rem">
      <div class="wd-list">
        ${withdrawUnits.map((w,i)=>`
          <div class="wd-item">
            <div class="wd-item-info">
              <div class="wd-item-name">${w.itemName}</div>
              <div class="wd-item-meta">${w.itemId} ${w.sn?'· S/N: '+w.sn:''} ${w.detail?'· '+w.detail:''}</div>
            </div>
            <button class="btn btn-icon btn-sm btn-danger" onclick="removeWd(${i})">✕</button>
          </div>`).join('')}
      </div>
    </div>
  </div>`:`
  <div class="empty-state" style="border:1.5px dashed var(--bdrm);border-radius:var(--rad)">ยังไม่มีรายการ</div>`}

  <!-- Summary sticky -->
  <div class="wd-summary-sticky">
    <div class="flex jb items-c" style="margin-bottom:10px">
      <div class="fz12 txmute">รวม ${withdrawUnits.length} ชิ้น · ${todayStr()}</div>
    </div>
    <div class="flex gap8">
      <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="submitWd()" ${withdrawUnits.length===0?'disabled':''}>✅ ยืนยันเบิก</button>
      <button class="btn" style="flex:1;justify-content:center" onclick="printWd()" ${withdrawUnits.length===0?'disabled':''}>🖨️ พิมพ์</button>
    </div>
  </div>`;
}

function loadWdUnits(){
  const id=document.getElementById('wItemSel').value;
  if(!id){document.getElementById('wUnitList').innerHTML='<div class="fz12 txmute">เลือกประเภทสินค้าเพื่อดูชิ้นส่วน</div>';return;}
  const avail=getAvail(id).filter(u=>!withdrawUnits.find(w=>w.unitId===u.docId));
  const item=allItems.find(i=>i.id===id);
  if(!avail.length){document.getElementById('wUnitList').innerHTML='<div class="fz12" style="color:var(--r)">ไม่มีชิ้นส่วนพร้อมใช้</div>';return;}
  document.getElementById('wUnitList').innerHTML=`
    <div class="fz12 fw7 txm" style="margin-bottom:6px">เลือกชิ้นที่ต้องการ (${avail.length} ชิ้นพร้อมใช้):</div>
    <div class="unit-picker">
      ${avail.map(u=>`
        <label class="unit-pick-row">
          <input type="checkbox" class="upick-cb" value="${u.docId}" data-item="${id}" data-name="${item.name}" data-sn="${u.sn||''}" data-detail="${u.detail||''}"/>
          ${snBadge(u)}
          <span class="fz12 txm" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.detail||'ไม่มีรายละเอียด'}</span>
        </label>`).join('')}
    </div>
    <button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="addCheckedWd()">+ เพิ่มที่เลือก</button>`;
}

function addCheckedWd(){
  const cbs=[...document.querySelectorAll('.upick-cb:checked')];
  if(!cbs.length){showNotif('เลือกอย่างน้อย 1 ชิ้น','error');return;}
  cbs.forEach(cb=>{
    if(!withdrawUnits.find(w=>w.unitId===cb.value))
      withdrawUnits.push({unitId:cb.value,itemId:cb.dataset.item,itemName:cb.dataset.name,sn:cb.dataset.sn,detail:cb.dataset.detail});
  });
  renderWithdrawTab();
}
function removeWd(i){withdrawUnits.splice(i,1);renderWithdrawTab();}

async function submitWd(){
  if(!withdrawUnits.length)return;
  const usedAt=document.getElementById('wUsedAt')?.value||'';
  if(!usedAt){showNotif('กรุณาระบุสถานที่ใช้งาน','error');return;}
  const reqBy=document.getElementById('wReqBy')?.value||'';
  const dept=document.getElementById('wDept')?.value||'';
  const hasService=document.getElementById('wHasService')?.value||'no';
  const serviceRef=document.getElementById('wServiceRef')?.value||'';
  const note=document.getElementById('wNote')?.value||'';
  try{
    const batch=db.batch();
    withdrawUnits.forEach(w=>{
      batch.update(db.collection('units').doc(w.unitId),{status:'used',usedAtLabel:usedAt,usedTxId:currentServiceNo,usedAt:firebase.firestore.FieldValue.serverTimestamp(),usedBy:currentUser.displayName});
      batch.set(db.collection('transactions').doc(),{type:'out',serviceNo:currentServiceNo,itemId:w.itemId,itemName:w.itemName,qty:1,sn:w.sn,unitId:w.unitId,detail:w.detail,usedAt,dept,reqBy,hasService,serviceRef,note,userId:currentUser.uid,userEmail:currentUser.email,userName:currentUser.displayName,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
    await batch.commit();
    withdrawUnits.forEach(w=>{const u=allUnits.find(x=>x.docId===w.unitId);if(u){u.status='used';u.usedAtLabel=usedAt;}});
    showNotif(`เบิกสำเร็จ ${withdrawUnits.length} ชิ้น`);
    const lU=[...withdrawUnits],lI={reqBy,dept,usedAt,hasService,serviceRef,note,serviceNo:currentServiceNo};
    withdrawUnits=[];currentServiceNo=genNo();
    renderWithdrawTab();
    if(confirm('เบิกสำเร็จ! พิมพ์ใบเบิก?'))doPrint(lU,lI);
  }catch(e){showNotif(e.message,'error');}
}
function printWd(){
  doPrint(withdrawUnits,{
    reqBy:document.getElementById('wReqBy')?.value||'',
    dept:document.getElementById('wDept')?.value||'',
    usedAt:document.getElementById('wUsedAt')?.value||'',
    hasService:document.getElementById('wHasService')?.value||'no',
    serviceRef:document.getElementById('wServiceRef')?.value||'',
    note:document.getElementById('wNote')?.value||'',
    serviceNo:currentServiceNo
  });
}
function doPrint(units,info){
  const stm={no:'ไม่มี',yes:'ใบ Service',job:'Job Order'};
  document.getElementById('printArea').innerHTML=`
  <div class="print-doc">
    <div class="print-header"><div class="print-title">ใบเบิกสินค้า / Spare Part Requisition</div><div>RYG Stock System</div></div>
    <div class="print-meta">
      <div><div class="pm-lbl">เลขที่ใบเบิก</div><div class="pm-val" style="font-size:16px">${info.serviceNo}</div></div>
      <div><div class="pm-lbl">วันที่</div><div class="pm-val">${todayStr()}</div></div>
      <div><div class="pm-lbl">ผู้เบิก</div><div class="pm-val">${info.reqBy}</div></div>
      <div><div class="pm-lbl">แผนก</div><div class="pm-val">${info.dept||'-'}</div></div>
      <div><div class="pm-lbl">ใช้งานที่</div><div class="pm-val">${info.usedAt||'-'}</div></div>
      <div><div class="pm-lbl">ใบ Service</div><div class="pm-val">${stm[info.hasService]||'-'} ${info.serviceRef?'('+info.serviceRef+')':''}</div></div>
      <div><div class="pm-lbl">ผู้อนุมัติ</div><div class="pm-val">${currentUser?.displayName||''}</div></div>
      <div><div class="pm-lbl">Email</div><div class="pm-val">${currentUser?.email||''}</div></div>
    </div>
    ${info.note?`<div style="background:#f5f5f5;border-radius:6px;padding:8px 10px;margin-bottom:1rem;font-size:12px"><b>หมายเหตุ:</b> ${info.note}</div>`:''}
    <table class="print-table">
      <tr><th>#</th><th>รหัส</th><th>ชื่อสินค้า</th><th>S/N</th><th>รายละเอียด</th><th>หมายเหตุ</th></tr>
      ${units.map((w,i)=>`<tr><td>${i+1}</td><td>${w.itemId}</td><td>${w.itemName}</td><td style="font-family:monospace">${w.sn||'-'}</td><td>${w.detail||'-'}</td><td></td></tr>`).join('')}
      <tr><td colspan="5" style="text-align:right;font-weight:700">รวม</td><td style="font-weight:700">${units.length} ชิ้น</td></tr>
    </table>
    <div class="print-sign">
      <div class="sign-box"><div class="sign-line">ลงชื่อ ผู้เบิก<br>(${info.reqBy})</div></div>
      <div class="sign-box"><div class="sign-line">ลงชื่อ ผู้อนุมัติ<br>(${currentUser?.displayName||''})</div></div>
    </div>
  </div>`;
  document.getElementById('printArea').style.display='block';
  window.print();
  setTimeout(()=>{document.getElementById('printArea').style.display='none';},1000);
}

// ═══════════════════════════════════════════════════
// HISTORY TAB
// ═══════════════════════════════════════════════════
function renderHistoryTab(){
  const data=currentRole==='admin'?historyData:historyData.filter(h=>h.userId===currentUser?.uid);
  document.getElementById('mainContent').innerHTML=`
  <div class="flex jb items-c section-gap">
    <span style="font-size:15px;font-weight:700">ประวัติ${currentRole==='user'?' (ของฉัน)':''}</span>
    ${currentRole==='user'?`<span class="badge badge-in">รายการของฉัน</span>`:''}
  </div>
  ${data.length===0?`<div class="empty-state">ยังไม่มีรายการ</div>`:`
  <div class="hist-list">
    ${data.map(h=>`
      <div class="hist-card">
        <div class="hist-top">
          <div class="hist-dot" style="background:${h.type==='in'?'#1D9E75':'#E24B4A'}"></div>
          <span class="hist-item">${h.itemName}</span>
          ${h.type==='in'?'<span class="badge badge-in">📥 นำเข้า</span>':'<span class="badge badge-out2">📤 เบิก</span>'}
        </div>
        ${h.sn?`<div class="hist-sn">S/N: ${h.sn}</div>`:''}
        <div class="hist-meta">
          ${h.usedAt?`📍 ${h.usedAt} · `:''}
          ${h.hasService==='yes'?'✅ ใบ Service ':h.hasService==='job'?'📋 Job Order ':''}
          ${h.serviceRef?`<span class="hist-ref">${h.serviceRef}</span> · `:''}
          ${h.dept?h.dept+' · ':''}
          ${currentRole==='admin'&&h.userName?h.userName+' · ':''}
          ${formatDT(h.createdAt)}
        </div>
        <div class="hist-ref" style="margin-top:3px">${h.serviceNo||''}</div>
      </div>`).join('')}
  </div>`}`;
}

// ═══════════════════════════════════════════════════
// USERS TAB
// ═══════════════════════════════════════════════════
let allUsers=[];
async function renderUsersTab(){
  document.getElementById('mainContent').innerHTML=`
  <div class="flex jb items-c section-gap">
    <span style="font-size:15px;font-weight:700">👥 จัดการผู้ใช้</span>
    <span class="fz12 txmute">เปลี่ยนสิทธิ์จะมีผลเมื่อล็อกอินใหม่</span>
  </div>
  <div class="card" id="usersCard"><div class="empty-state">กำลังโหลด...</div></div>`;
  try{
    const snap=await db.collection('users').orderBy('createdAt','desc').get();
    allUsers=snap.docs.map(d=>({docId:d.id,...d.data()}));
    renderUsersTable();
  }catch(e){
    document.getElementById('usersCard').innerHTML=`<div class="empty-state" style="color:var(--r)">โหลดไม่สำเร็จ: ${e.message}</div>`;
  }
}
function renderUsersTable(){
  document.getElementById('usersCard').innerHTML=`
  <div style="padding:.5rem 0">
    ${allUsers.map(u=>{
      const isMe=u.docId===currentUser?.uid;
      const init=(u.displayName||u.email||'U')[0].toUpperCase();
      return`<div style="display:flex;align-items:center;gap:10px;padding:.7rem 1rem;border-bottom:1px solid var(--bdr)${isMe?';background:#FFFDE7':''}">
        ${u.photoURL?`<img src="${u.photoURL}" class="user-ava" style="width:34px;height:34px" onerror="this.style.display='none'"/>`:`<div class="user-ava" style="width:34px;height:34px;font-size:13px">${init}</div>`}
        <div style="flex:1;min-width:0">
          <div class="fw7 fz12">${u.displayName||'(ไม่มีชื่อ)'}${isMe?' <span class="badge badge-ok">คุณ</span>':''}</div>
          <div class="fz11 txmute" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.email||''}</div>
        </div>
        ${isMe?`<span class="badge ${u.role==='admin'?'badge-admin':'badge-user'}">${u.role==='admin'?'🔑 Admin':'👤 User'}</span>`:`
        <select style="padding:5px 8px;border:1px solid var(--bdrm);border-radius:var(--radsm);font-size:12px;font-family:var(--font);background:var(--surf);cursor:pointer" onchange="changeRole('${u.docId}',this.value,this)">
          <option value="user" ${u.role!=='admin'?'selected':''}>👤 User</option>
          <option value="admin" ${u.role==='admin'?'selected':''}>🔑 Admin</option>
        </select>`}
      </div>`;
    }).join('')}
  </div>
  <div style="padding:.6rem 1rem;background:#FAFAFA;border-top:1px solid var(--bdr);font-size:11px;color:var(--tx3)">
    ${allUsers.length} บัญชี · Admin ${allUsers.filter(u=>u.role==='admin').length} · User ${allUsers.filter(u=>u.role!=='admin').length}
  </div>`;
}
async function changeRole(uid,newRole,el){
  const user=allUsers.find(u=>u.docId===uid);if(!user)return;
  const oldRole=user.role||'user';if(oldRole===newRole)return;
  if(!confirm(`เปลี่ยนสิทธิ์ "${user.displayName||user.email}" เป็น ${newRole}?`)){el.value=oldRole;return;}
  try{await db.collection('users').doc(uid).update({role:newRole});user.role=newRole;showNotif('เปลี่ยนสิทธิ์สำเร็จ');renderUsersTable();}
  catch(e){showNotif('ไม่สำเร็จ: '+e.message,'error');el.value=oldRole;}
}

// ═══════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════
function showModal(html,wide=false){
  const div=document.createElement('div');
  div.className='modal-overlay';div.id='modalOverlay';
  div.innerHTML=`<div class="modal ${wide?'modal-lg':''}">${html}</div>`;
  div.addEventListener('click',e=>{if(e.target===div)closeModal();});
  document.body.appendChild(div);
}
function closeModal(){const m=document.getElementById('modalOverlay');if(m)m.remove();}

// ═══════════════════════════════════════════════════
// NOTIF
// ═══════════════════════════════════════════════════
function showNotif(msg,type='ok'){
  const n=document.getElementById('notif');
  n.textContent=msg;n.className='notif show'+(type==='error'?' error':'');
  setTimeout(()=>n.className='notif',2800);
}
</script>
