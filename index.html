<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>RYG Stock — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css"/>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div id="loadingScreen">
  <div style="width:52px;height:52px;background:#1D9E75;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;">📦</div>
  <div style="font-size:15px;font-weight:700;">RYG Stock System</div>
  <div class="spinner"></div>
</div>
<div id="mainApp">
  <div class="topbar">
    <div class="topbar-logo">📦</div>
    <span class="topbar-title">RYG Stock</span>
    <div class="user-mini">
      <img id="uAvatar" class="user-ava" src="" onerror="this.style.display='none'" alt=""/>
      <span id="uFallback" class="user-ava"></span>
      <span id="uName" class="user-name-top"></span>
      <span id="uRole" class="badge-role badge-admin"></span>
      <button class="btn-topout" onclick="doLogout()">ออก</button>
    </div>
  </div>
  <div class="nav-tabs" id="navTabs"></div>
  <div class="content" id="mainContent"></div>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>
<div id="printArea"></div>
<div id="notif"></div>

<script>
let allItems=[], allUnits=[], historyData=[], currentUser=null, currentRole='user', db=null;

initShell('dashboard', async (user, role, firestore) => {
  currentUser=user; currentRole=role; db=firestore;
  await loadItems();
  await loadUnits();
  subscribeHistory();
});

async function loadItems(){
  const snap=await db.collection('items').orderBy('id').get();
  allItems=snap.docs.map(d=>({docId:d.id,...d.data()}));
  if(!allItems.length) await seedItems();
}
async function seedItems(){
  const seed=[
    {id:'SP001',name:'SSD 128GB',min:2,loc:'ชั้น IT',cat:'Storage'},
    {id:'SP002',name:'SSD 240GB',min:2,loc:'ชั้น IT',cat:'Storage'},
    {id:'SP003',name:'HDD 320GB',min:1,loc:'ชั้น IT',cat:'Storage'},
    {id:'SP004',name:'HDD 500GB',min:3,loc:'ชั้น IT',cat:'Storage'},
    {id:'SP005',name:'HDD 1TB',min:3,loc:'ชั้น IT',cat:'Storage'},
    {id:'SP006',name:'HDD 2TB',min:1,loc:'ชั้น IT',cat:'Storage'},
    {id:'SP007',name:'RAM PC3 8GB',min:2,loc:'ชั้น IT',cat:'Memory'},
    {id:'SP008',name:'RAM PC3 4GB',min:3,loc:'ชั้น IT',cat:'Memory'},
    {id:'SP009',name:'RAM PC3 2GB',min:2,loc:'ชั้น IT',cat:'Memory'},
    {id:'SP010',name:'RAM PC4 4GB',min:2,loc:'ชั้น IT',cat:'Memory'},
    {id:'SP011',name:'CPU',min:3,loc:'ชั้น IT',cat:'Component'},
    {id:'SP012',name:'GPU',min:2,loc:'ชั้น IT',cat:'Component'},
    {id:'SP013',name:'PCI USB Card 4 Port',min:1,loc:'ชั้น IT',cat:'Component'},
    {id:'SP014',name:'PCI USB Card 2 Port',min:2,loc:'ชั้น IT',cat:'Component'},
    {id:'SP015',name:'PCI Network Adapter',min:2,loc:'ชั้น IT',cat:'Network'},
    {id:'SP016',name:'Power Supply 550W Bronze',min:1,loc:'ชั้น IT',cat:'Component'},
    {id:'SP017',name:'Power Supply DELL 240V',min:1,loc:'ชั้น IT',cat:'Component'},
    {id:'SP018',name:'Switch ZYXEL 16 Port',min:1,loc:'ชั้น IT',cat:'Network'},
    {id:'SP019',name:'Switch ZYXEL 24 Port',min:1,loc:'ชั้น IT',cat:'Network'},
    {id:'SP020',name:'Switch Aruba 24G 4SFP',min:1,loc:'ชั้น IT',cat:'Network'},
    {id:'SP021',name:'Switch D-Link 8 Port',min:1,loc:'ชั้น IT',cat:'Network'},
    {id:'SP022',name:'Switch D-Link 16 Port',min:2,loc:'ชั้น IT',cat:'Network'},
    {id:'SP023',name:'Switch D-Link 24 Port',min:1,loc:'ชั้น IT',cat:'Network'},
    {id:'SP024',name:'Switch Dahua POE 8-Port',min:1,loc:'ชั้น IT',cat:'Network'},
    {id:'SP025',name:'Dahua IP Camera',min:1,loc:'ชั้น IT',cat:'Camera'},
    {id:'SP026',name:'Starcam IP Camera',min:1,loc:'ชั้น IT',cat:'Camera'},
    {id:'SP027',name:'VGA to HDMI',min:1,loc:'ชั้น IT',cat:'Cable'},
    {id:'SP028',name:'HDMI to VGA',min:1,loc:'ชั้น IT',cat:'Cable'},
    {id:'SP029',name:'DisplayPort to HDMI',min:1,loc:'ชั้น IT',cat:'Cable'},
    {id:'SP030',name:'DisplayPort to VGA',min:1,loc:'ชั้น IT',cat:'Cable'},
    {id:'SP031',name:'สาย AC Power',min:5,loc:'ชั้น IT',cat:'Cable'},
    {id:'SP032',name:'สาย VGA',min:5,loc:'ชั้น IT',cat:'Cable'},
    {id:'SP033',name:'สาย DisplayPort',min:2,loc:'ชั้น IT',cat:'Cable'},
    {id:'SP034',name:'สาย HDMI',min:3,loc:'ชั้น IT',cat:'Cable'},
    {id:'SP035',name:'สาย Printer USB',min:3,loc:'ชั้น IT',cat:'Cable'},
    {id:'SP036',name:'สายแลน OUTDOOR CAT6',min:1,loc:'ชั้น IT',cat:'Cable'},
    {id:'SP037',name:'สายแลน OUTDOOR Sling CAT6',min:1,loc:'ชั้น IT',cat:'Cable'},
    {id:'SP038',name:'หัวสายแลน CAT6 RJ45',min:5,loc:'ชั้น IT',cat:'Cable'},
    {id:'SP039',name:'Adapter 12V 2A',min:2,loc:'ชั้น IT',cat:'Power'},
    {id:'SP040',name:'Switching PSU 5A',min:1,loc:'ชั้น IT',cat:'Power'},
    {id:'SP041',name:'Switching PSU 20A',min:1,loc:'ชั้น IT',cat:'Power'},
    {id:'SP042',name:'Switching PSU 10A',min:1,loc:'ชั้น IT',cat:'Power'},
    {id:'SP043',name:'Monitor',min:2,loc:'ชั้น IT',cat:'Device'},
    {id:'SP044',name:'Computer',min:1,loc:'ชั้น IT',cat:'Device'},
    {id:'SP045',name:'Keyboard',min:2,loc:'ชั้น IT',cat:'Device'},
    {id:'SP046',name:'Mouse',min:2,loc:'ชั้น IT',cat:'Device'},
    {id:'SP047',name:'Webcam',min:2,loc:'ชั้น IT',cat:'Device'},
    {id:'SP048',name:'ลำโพงเล็กสีดำ',min:1,loc:'ชั้น IT',cat:'Device'},
    {id:'SP049',name:'Printer',min:1,loc:'ชั้น IT',cat:'Device'},
  ];
  const batch=db.batch();
  seed.forEach(i=>batch.set(db.collection('items').doc(i.id),i));
  await batch.commit(); await loadItems();
}
async function loadUnits(){
  const snap=await db.collection('units').get();
  allUnits=snap.docs.map(d=>({docId:d.id,...d.data()}));
}
function getItemQty(id){ return allUnits.filter(u=>u.itemId===id&&u.status==='available').length; }
function getStatus(id){
  const q=getItemQty(id),item=allItems.find(i=>i.id===id);
  if(!item)return'ok'; if(q<=0)return'out'; if(q<=(item.min||1))return'low'; return'ok';
}
function statusBadge(id){
  const s=getStatus(id);
  if(s==='out')return'<span class="badge badge-out">หมดสต็อก</span>';
  if(s==='low')return'<span class="badge badge-low">ใกล้หมด</span>';
  return'<span class="badge badge-ok">ปกติ</span>';
}

let histUnsub=null;
function subscribeHistory(){
  if(histUnsub)histUnsub();
  histUnsub=db.collection('transactions').orderBy('createdAt','desc').limit(200)
    .onSnapshot(snap=>{ historyData=snap.docs.map(d=>({id:d.id,...d.data()})); renderDashboard(); });
}

function renderDashboard(){
  const totalAvail=allUnits.filter(u=>u.status==='available').length;
  const out=allItems.filter(i=>getItemQty(i.id)<=0).length;
  const low=allItems.filter(i=>{const q=getItemQty(i.id);return q>0&&q<=(i.min||1);}).length;
  const cats={};
  allItems.forEach(i=>{const g=getGroupKey(i.cat);cats[g]=(cats[g]||0)+getItemQty(i.id);});
  const topCats=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const maxV=topCats[0]?topCats[0][1]:1;
  const recent=historyData.slice(0,6);
  const alerts=allItems.filter(i=>getStatus(i.id)!=='ok').slice(0,8);
  document.getElementById('mainContent').innerHTML=`
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-label">ประเภทสินค้า</div><div class="stat-value">${allItems.length}</div><div class="stat-sub">รายการ</div></div>
    <div class="stat-card"><div class="stat-label">ชิ้นส่วนพร้อมใช้</div><div class="stat-value">${totalAvail}</div><div class="stat-sub">ชิ้น</div></div>
    <div class="stat-card"><div class="stat-label" style="color:var(--am)">ใกล้หมด</div><div class="stat-value" style="color:var(--am)">${low}</div><div class="stat-sub">รายการ</div></div>
    <div class="stat-card"><div class="stat-label" style="color:var(--r)">หมดสต็อก</div><div class="stat-value" style="color:var(--r)">${out}</div><div class="stat-sub">รายการ</div></div>
  </div>
  <div class="dash-grid">
    <div class="card">
      <div class="card-header"><span class="card-title">สต็อกตามกลุ่ม</span></div>
      <div style="padding:1rem">
        ${topCats.map(([k,v])=>{const g=getGroupDef(k);return`
          <div style="margin-bottom:11px">
            <div class="flex jb fz12" style="margin-bottom:4px"><span>${g.icon} ${g.label}</span><span class="txmute">${v} ชิ้น</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(v/maxV*100)}%"></div></div>
          </div>`;}).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">ความเคลื่อนไหวล่าสุด</span></div>
      <div style="padding:1rem">
        ${recent.length===0?'<div class="empty-state">ยังไม่มีรายการ</div>':
          recent.map(h=>`<div class="flex gap8 items-c" style="margin-bottom:10px">
            <div class="hist-dot" style="background:${h.type==='in'?'#1D9E75':'#E24B4A'};flex-shrink:0"></div>
            <div style="flex:1;min-width:0">
              <div class="fz12 fw7" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.type==='in'?'นำเข้า':'เบิก'} ${h.itemName}</div>
              <div class="fz11 txmute">${h.userName||''}</div>
            </div>
            <div class="fz11 txmute" style="flex-shrink:0">${formatDT(h.createdAt)}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>
  ${alerts.length>0?`
  <div class="card">
    <div class="card-header"><span class="card-title">⚠️ ต้องจัดการ</span></div>
    <div style="padding:.5rem 0">
      ${alerts.map(i=>`
        <div class="item-row" onclick="navigate('stock')">
          <div><div class="item-name">${i.name}</div><div class="item-code">${i.id}</div></div>
          <div class="item-right">${statusBadge(i.id)}<span class="fz12 fw7">${getItemQty(i.id)} ชิ้น</span></div>
        </div>`).join('')}
    </div>
  </div>`:''}`;
}
</script>
</body>
</html>
