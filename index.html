<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RYG Stock System</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root {
    --green: #1D9E75; --green-dark: #0F6E56; --green-light: #E1F5EE;
    --blue: #185FA5; --blue-light: #E6F1FB;
    --amber: #854F0B; --amber-light: #FAEEDA;
    --red: #A32D2D; --red-light: #FCEBEB;
    --purple: #5B3DC8; --purple-light: #EEEAFF;
    --bg: #F4F6F9; --surface: #fff;
    --border: rgba(0,0,0,0.1); --border-md: rgba(0,0,0,0.18);
    --text: #1a1a1a; --text-2: #555; --text-3: #888;
    --radius: 8px; --radius-lg: 12px;
    --font: 'Sarabun', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; }

  /* LOGIN */
  #loginScreen { min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0F6E56,#1D9E75,#5DCAA5); }
  .login-card { background:var(--surface);border-radius:16px;padding:2.5rem;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.15); }
  .login-logo { display:flex;align-items:center;gap:12px;margin-bottom:2rem; }
  .logo-icon { width:48px;height:48px;background:var(--green);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px; }
  .btn-google { width:100%;padding:12px;border:1.5px solid var(--border-md);border-radius:var(--radius);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:500; }
  .btn-google:hover { background:#f5f5f5; }
  .login-note { font-size:12px;color:var(--text-3);text-align:center;margin-top:1rem; }

  /* LAYOUT */
  #mainApp { display:none;flex-direction:column;min-height:100vh; }
  .topbar { background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50; }
  .topbar-left { display:flex;align-items:center;gap:12px; }
  .topbar-logo { width:32px;height:32px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px; }
  .topbar-title { font-size:16px;font-weight:700; }
  .topbar-right { display:flex;align-items:center;gap:12px; }
  .user-chip { display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:20px;padding:4px 12px 4px 4px; }
  .user-avatar { width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--green-dark); }
  .badge-role { padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700; }
  .badge-admin { background:var(--green-light);color:var(--green-dark); }
  .badge-user { background:var(--blue-light);color:var(--blue); }
  .btn-logout { padding:6px 14px;border:1px solid var(--border-md);border-radius:var(--radius);background:transparent;cursor:pointer;font-size:13px;color:var(--text-2); }
  .btn-logout:hover { background:var(--bg); }
  .nav-tabs { background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;overflow-x:auto; }
  .nav-tab { padding:12px 18px;font-size:13px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;white-space:nowrap; }
  .nav-tab.active { color:var(--green);border-bottom-color:var(--green);font-weight:600; }
  .nav-tab:hover:not(.active) { color:var(--text); }
  .content { padding:1.5rem;flex:1; }

  /* CARDS */
  .stat-grid { display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem; }
  .stat-card { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem; }
  .stat-label { font-size:12px;color:var(--text-2);margin-bottom:6px; }
  .stat-value { font-size:26px;font-weight:700; }
  .stat-sub { font-size:11px;color:var(--text-3);margin-top:2px; }
  .card { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden; }
  .card-header { padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between; }
  .card-title { font-size:14px;font-weight:600; }

  /* TABLE */
  .table-wrap { overflow-x:auto; }
  table { width:100%;border-collapse:collapse;table-layout:fixed; }
  th { padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text-3);background:#FAFAFA;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.5px; }
  td { padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border); }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#FAFAFA; }

  /* BADGES */
  .badge { display:inline-flex;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600; }
  .badge-ok { background:var(--green-light);color:var(--green-dark); }
  .badge-low { background:var(--amber-light);color:var(--amber); }
  .badge-out { background:var(--red-light);color:var(--red); }
  .badge-in { background:var(--green-light);color:var(--green-dark); }
  .badge-out2 { background:var(--red-light);color:var(--red); }
  .badge-sn { background:var(--purple-light);color:var(--purple);font-family:monospace; }
  .badge-used { background:#F0F0F0;color:#888; }
  .badge-available { background:var(--green-light);color:var(--green-dark); }
  .badge-damaged { background:var(--amber-light);color:var(--amber); }

  /* BUTTONS */
  .btn { padding:7px 14px;border-radius:var(--radius);font-size:13px;cursor:pointer;border:1px solid var(--border-md);background:var(--surface);color:var(--text-2);display:inline-flex;align-items:center;gap:6px; }
  .btn:hover { background:var(--bg); }
  .btn-primary { background:var(--green);color:#fff;border-color:var(--green); }
  .btn-primary:hover { background:var(--green-dark); }
  .btn-danger { background:var(--red-light);color:var(--red);border-color:#F09595; }
  .btn-icon { padding:5px 8px;border-radius:6px; }
  .btn:disabled { opacity:.45;cursor:not-allowed; }

  /* FORM */
  .field { margin-bottom:1rem; }
  .field label { display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px; }
  .field input,.field select,.field textarea { width:100%;padding:8px 12px;border:1px solid var(--border-md);border-radius:var(--radius);font-size:13px;font-family:var(--font);background:var(--surface);color:var(--text); }
  .field textarea { resize:vertical;min-height:72px; }
  .field input:focus,.field select:focus,.field textarea:focus { outline:none;border-color:var(--green); }
  .grid-2 { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
  .grid-3 { display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px; }

  /* MODAL */
  .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200; }
  .modal { background:var(--surface);border-radius:14px;padding:1.75rem;width:560px;max-width:95vw;max-height:90vh;overflow-y:auto; }
  .modal-lg { width:720px; }
  .modal-xl { width:900px; }
  .modal-title { font-size:16px;font-weight:700;margin-bottom:1.25rem; }
  .modal-actions { display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border); }

  /* UNIT DETAIL */
  .unit-card {
    border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;
    display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
    transition:border-color .15s;
  }
  .unit-card:hover { border-color:var(--green); }
  .unit-sn { font-family:monospace;font-size:12px;font-weight:700;color:var(--purple);background:var(--purple-light);padding:3px 8px;border-radius:6px; }
  .unit-no-sn { font-family:monospace;font-size:11px;color:var(--text-3);background:#F0F0F0;padding:3px 8px;border-radius:6px; }
  .unit-meta { font-size:11px;color:var(--text-3);margin-top:2px; }

  /* UNIT STATUS DOTS */
  .dot { width:9px;height:9px;border-radius:50%;flex-shrink:0; }
  .dot-available { background:#1D9E75; }
  .dot-used { background:#888; }
  .dot-damaged { background:#E5A600; }

  /* QR */
  .qr-panel { max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem; }
  .qr-box { width:200px;height:200px;border:2px dashed var(--border-md);border-radius:var(--radius-lg);margin:1.5rem auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:var(--text-3);font-size:13px;overflow:hidden;position:relative; }
  .qr-box:hover { border-color:var(--green);color:var(--green); }
  .scan-line { position:absolute;top:0;left:0;right:0;height:3px;background:var(--green);animation:scanAnim 1.8s ease-in-out infinite; }
  @keyframes scanAnim { 0%{top:0} 50%{top:calc(100% - 3px)} 100%{top:0} }
  .qr-result { background:var(--bg);border-radius:var(--radius);padding:1rem 1.25rem;margin:1rem 0; }
  .result-row { display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px; }
  .result-label { font-size:12px;color:var(--text-3); }
  .result-value { font-size:13px;font-weight:600; }
  .op-tabs { display:flex;gap:8px;margin:1rem 0; }
  .op-tab { flex:1;padding:10px;border:1px solid var(--border-md);border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:500;text-align:center;color:var(--text-2);background:var(--bg); }
  .op-tab.active { background:var(--green);border-color:var(--green);color:#fff; }

  /* SERVICE FORM */
  .service-ref { background:var(--green-light);border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between; }
  .service-ref-label { font-size:12px;color:var(--green-dark); }
  .service-ref-no { font-size:18px;font-weight:700;color:var(--green-dark);font-family:monospace; }

  /* ADD UNITS BATCH */
  .sn-row { display:flex;gap:8px;align-items:center;margin-bottom:6px; }
  .sn-row input { flex:1;padding:7px 10px;border:1px solid var(--border-md);border-radius:var(--radius);font-size:13px;font-family:monospace; }
  .sn-row .detail-in { flex:1.5; }

  /* PRINT */
  @media print {
    #mainApp,.topbar,.nav-tabs,.content { display:none!important; }
    #printArea { display:block!important; }
  }
  #printArea { display:none; }
  .print-doc { max-width:750px;margin:0 auto;padding:2rem;font-family:'Sarabun',sans-serif; }
  .print-header { text-align:center;margin-bottom:1.5rem;border-bottom:2px solid #000;padding-bottom:1rem; }
  .print-title { font-size:20px;font-weight:700;margin-bottom:4px; }
  .print-meta { display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:1rem 0; }
  .print-meta-label { font-size:11px;color:#666; }
  .print-meta-value { font-size:13px;font-weight:600; }
  .print-table { width:100%;border-collapse:collapse;margin-top:1rem; }
  .print-table th,.print-table td { border:1px solid #ccc;padding:8px 10px;font-size:13px; }
  .print-table th { background:#f0f0f0;font-weight:700; }
  .print-sign { display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:3rem; }
  .sign-box { text-align:center; }
  .sign-line { border-top:1px solid #000;margin-top:3rem;padding-top:6px;font-size:12px; }

  /* NOTIF */
  #notif { position:fixed;bottom:24px;right:24px;background:var(--green);color:#fff;padding:12px 20px;border-radius:var(--radius);font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none; }
  #notif.show { opacity:1; }
  #notif.error { background:var(--red); }

  /* LOADING */
  #loadingScreen { position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999; }
  .spinner { width:40px;height:40px;border:3px solid var(--green-light);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* UTILS */
  .search-bar { display:flex;gap:8px;align-items:center; }
  .search-input { padding:7px 12px;border:1px solid var(--border-md);border-radius:var(--radius);font-size:13px;width:220px;background:var(--surface); }
  .bar-bg { background:#E5E7EB;border-radius:4px;height:7px; }
  .bar-fill { background:var(--green);height:7px;border-radius:4px;transition:width .4s; }
  .section-gap { margin-bottom:1.5rem; }
  .flex { display:flex; } .gap8 { gap:8px; } .items-center { align-items:center; } .justify-between { justify-content:space-between; }
  .text-sm { font-size:12px; } .text-muted { color:var(--text-3); } .mono { font-family:monospace; } .fw600 { font-weight:600; }
  .expand-row td { background:#FAFCFF!important; }
  .expand-panel { padding:12px 14px;background:#F7F9FE;border-bottom:1px solid var(--border); }

  /* Unit selector in withdraw */
  .unit-picker { border:1px solid var(--border-md);border-radius:var(--radius);overflow:hidden;margin-top:8px; }
  .unit-pick-row { display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer; }
  .unit-pick-row:last-child { border-bottom:none; }
  .unit-pick-row:hover { background:var(--bg); }
  .unit-pick-row.selected { background:var(--green-light); }
  .unit-pick-cb { width:16px;height:16px;flex-shrink:0; }

  /* Role select */
  .role-select { padding:5px 10px;border:1px solid var(--border-md);border-radius:var(--radius);font-size:12px;font-family:var(--font);background:var(--surface);cursor:pointer; }
  .user-row-avatar { width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--green-light);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--green-dark);flex-shrink:0;vertical-align:middle; }

  /* History dot */
  .hist-dot { width:8px;height:8px;border-radius:50%;flex-shrink:0; }

  /* Tab badge */
  .tab-badge { background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700;min-width:18px;text-align:center; }
</style>
</head>
<body>

<div id="loadingScreen">
  <div style="width:48px;height:48px;background:var(--green);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:1rem;">📦</div>
  <div style="font-size:16px;font-weight:600;margin-bottom:1rem;">RYG Stock System</div>
  <div class="spinner"></div>
</div>

<div id="loginScreen" style="display:none;">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">📦</div>
      <div><h1 style="font-size:20px;font-weight:700">RYG Stock System</h1><p style="font-size:13px;color:var(--text-2)">ระบบจัดการสต็อก Spare Part</p></div>
    </div>
    <button class="btn-google" onclick="signInGoogle()">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      เข้าสู่ระบบด้วย Google
    </button>
    <div class="login-note">ระบบจะตรวจสอบสิทธิ์จาก Email ที่กำหนดไว้ใน Firestore</div>
  </div>
</div>

<div id="mainApp">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">📦</div>
      <span class="topbar-title">RYG Stock System</span>
    </div>
    <div class="topbar-right">
      <div class="user-chip">
        <img id="userAvatar" class="user-avatar" src="" onerror="this.style.display='none'" alt=""/>
        <span id="userAvatarFallback" class="user-avatar"></span>
        <span id="userDisplayName" style="font-size:13px;font-weight:500"></span>
      </div>
      <span id="roleLabel" class="badge-role badge-admin">Admin</span>
      <button class="btn-logout" onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </div>
  <div class="nav-tabs" id="navTabs"></div>
  <div class="content" id="mainContent"><div style="text-align:center;padding:3rem;color:var(--text-3)">กำลังโหลด...</div></div>
</div>

<div id="printArea"></div>
<div id="notif"></div>

<script>
// ============================================================
// FIREBASE CONFIG
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyABKbRCDNh5SHwvbuFtAudLnRYepZfXk7s",
  authDomain: "ryg-stock.firebaseapp.com",
  projectId: "ryg-stock",
  storageBucket: "ryg-stock.firebasestorage.app",
  messagingSenderId: "338213551131",
  appId: "1:338213551131:web:153773df4f8111b2364cbe"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ============================================================
// STATE
// ============================================================
let currentUser = null, currentRole = 'user', currentTab = 'dashboard';
let allItems = [];        // item definitions (SP001..SP049)
let allUnits = [];        // individual unit records
let historyData = [];
let historyUnsub = null;
let searchQ = '';
let expandedItem = null;
let withdrawUnits = [];   // { unitId, itemId, itemName, sn, detail }
let currentServiceNo = '';
let scanStep = 0, scannedItem = null, scanOp = 'out';

// ============================================================
// TAB CONFIG
// ============================================================
const TABS_ADMIN = [
  { id:'dashboard', icon:'📊', label:'Dashboard' },
  { id:'stock',     icon:'📦', label:'สต็อกสินค้า' },
  { id:'qr',        icon:'📷', label:'สแกน QR' },
  { id:'withdraw',  icon:'📤', label:'เบิกสินค้า' },
  { id:'history',   icon:'🕐', label:'ประวัติ' },
  { id:'users',     icon:'👥', label:'ผู้ใช้งาน' },
];
const TABS_USER = [
  { id:'dashboard', icon:'📊', label:'Dashboard' },
  { id:'qr',        icon:'📷', label:'สแกน QR' },
  { id:'history',   icon:'🕐', label:'ประวัติ' },
];
const getTabList = () => currentRole === 'admin' ? TABS_ADMIN : TABS_USER;

function renderNavTabs() {
  document.getElementById('navTabs').innerHTML = getTabList().map(t => `
    <div class="nav-tab ${currentTab===t.id?'active':''}" onclick="showTab('${t.id}')">
      ${t.icon} ${t.label}
    </div>`).join('');
}

// ============================================================
// AUTH
// ============================================================
auth.onAuthStateChanged(async (user) => {
  document.getElementById('loadingScreen').style.display = 'none';
  if (!user) {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
    return;
  }
  currentUser = user;
  await loadUserRole(user);
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'flex';
  updateUserUI();
  await loadItems();
  await loadUnits();
  showTab('dashboard');
  subscribeHistory();
});

async function loadUserRole(user) {
  try {
    const doc = await db.collection('users').doc(user.uid).get();
    if (doc.exists) {
      currentRole = doc.data().role || 'user';
    } else {
      await db.collection('users').doc(user.uid).set({
        email: user.email, displayName: user.displayName, photoURL: user.photoURL||'',
        role: 'user', createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      currentRole = 'user';
    }
  } catch(e) { currentRole = 'user'; }
}

function updateUserUI() {
  document.getElementById('userDisplayName').textContent = currentUser.displayName || currentUser.email;
  const avatar = document.getElementById('userAvatar');
  const fallback = document.getElementById('userAvatarFallback');
  if (currentUser.photoURL) { avatar.src = currentUser.photoURL; avatar.style.display=''; fallback.style.display='none'; }
  else { avatar.style.display='none'; fallback.style.display=''; fallback.textContent=(currentUser.displayName||currentUser.email||'U')[0].toUpperCase(); }
  const rl = document.getElementById('roleLabel');
  rl.textContent = currentRole==='admin'?'Admin':'User';
  rl.className = 'badge-role '+(currentRole==='admin'?'badge-admin':'badge-user');
}

function signInGoogle() {

// FIRESTORE — UNITS (individual pieces)
// ============================================================
// unit document structure:
// { itemId, sn:'', detail:'', status:'available'|'used'|'damaged',
//   addedAt, addedBy, usedAt(timestamp), usedBy, usedTxId, note }
async function loadUnits() {
  const snap = await db.collection('units').get();
  allUnits = snap.docs.map(d => ({ docId:d.id, ...d.data() }));
}

function getUnitsOf(itemId) { return allUnits.filter(u => u.itemId === itemId); }
function getAvailableUnits(itemId) { return getUnitsOf(itemId).filter(u => u.status === 'available'); }
function getItemQty(itemId) { return getAvailableUnits(itemId).length; }

// ============================================================
// HISTORY
// ============================================================
function subscribeHistory() {
  if (historyUnsub) historyUnsub();
  historyUnsub = db.collection('transactions').orderBy('createdAt','desc').limit(200)
    .onSnapshot(snap => {
      historyData = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      if (currentTab==='history') renderHistoryTab();
      if (currentTab==='dashboard') renderDashboardTab();
    });
}

// ============================================================
// TAB ROUTING
// ============================================================
function showTab(tab) {
  const allowed = getTabList().map(t => t.id);
  if (!allowed.includes(tab)) tab = 'dashboard';
  currentTab = tab;
  renderNavTabs();
  if (tab==='dashboard') renderDashboardTab();
  else if (tab==='stock')    renderStockTab();
  else if (tab==='qr')       renderQRTab();
  else if (tab==='withdraw') renderWithdrawTab();
  else if (tab==='history')  renderHistoryTab();
  else if (tab==='users')    renderUsersTab();
}

// ============================================================
// HELPERS
// ============================================================
function getStatus(itemId) {
  const qty = getItemQty(itemId);
  const item = allItems.find(i => i.id === itemId);
  if (!item) return 'ok';
  if (qty <= 0) return 'out';
  if (qty <= item.min) return 'low';
  return 'ok';
}
function statusBadge(itemId) {
  const s = getStatus(itemId);
  if (s==='out') return '<span class="badge badge-out">หมดสต็อก</span>';
  if (s==='low') return '<span class="badge badge-low">ใกล้หมด</span>';
  return '<span class="badge badge-ok">ปกติ</span>';
}
function formatDT(ts) {
  if (!ts) return '-';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}
function todayStr() { return new Date().toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function genServiceNo() {
  const d=new Date();
  return 'WD-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(Math.floor(Math.random()*9000)+1000);
}
function snBadge(unit) {
  return unit.sn
    ? `<span class="badge-sn badge">${unit.sn}</span>`
    : `<span class="unit-no-sn">ไม่มี S/N</span>`;
}
function unitStatusBadge(status) {
  if (status==='used') return '<span class="badge badge-used">เบิกแล้ว</span>';
  if (status==='damaged') return '<span class="badge badge-damaged">ชำรุด</span>';
  return '<span class="badge badge-available">พร้อมใช้</span>';
}

function unitInputRow(u, i) {
  return `<div class="sn-row" id="unitrow-${i}">
    <input placeholder="S/N หรือเว้นว่าง" value="${u.sn||''}"
      oninput="pendingUnits[${i}].sn=this.value" style="flex:1.2;font-family:monospace;font-size:12px"/>
    <input class="detail-in" placeholder="รายละเอียด เช่น 2TB 7200RPM / MAC: AA:BB..." value="${u.detail||''}"
      oninput="pendingUnits[${i}].detail=this.value" style="flex:2"/>
    <input placeholder="หมายเหตุ" value="${u.note||''}"
      oninput="pendingUnits[${i}].note=this.value" style="flex:1.2"/>
    <button class="btn btn-icon" onclick="removePendingRow(${i})" style="color:var(--red);flex-shrink:0">✕</button>
  </div>`;
}

function addPendingRow(itemId) {
  pendingUnits.push({ sn:'', detail:'', note:'' });
  document.getElementById('pendingUnitsList').innerHTML = pendingUnits.map((u,i)=>unitInputRow(u,i)).join('');
  const mo = document.querySelector('#modalOverlay .modal .modal-actions .btn-primary');
  if (mo) mo.textContent = `💾 บันทึกทั้งหมด (${pendingUnits.length} ชิ้น)`;
}

function removePendingRow(idx) {
  if (pendingUnits.length === 1) { showNotif('ต้องมีอย่างน้อย 1 แถว','error'); return; }
  pendingUnits.splice(idx,1);
  document.getElementById('pendingUnitsList').innerHTML = pendingUnits.map((u,i)=>unitInputRow(u,i)).join('');
}

async function doSaveUnits(itemId) {
  const item = allItems.find(i=>i.id===itemId);
  // collect latest values from DOM
  pendingUnits.forEach((u,i) => {
    const row = document.getElementById(`unitrow-${i}`);
    if (row) {
      const inputs = row.querySelectorAll('input');
      u.sn = inputs[0].value.trim();
      u.detail = inputs[1].value.trim();
      u.note = inputs[2].value.trim();
    }
  });
  if (pendingUnits.length === 0) return;

  const batch = db.batch();
  const newUnits = pendingUnits.map(u => ({
    itemId, sn: u.sn, detail: u.detail, note: u.note,
    status: 'available',
    addedAt: firebase.firestore.FieldValue.serverTimestamp(),
    addedBy: currentUser.displayName, addedByUid: currentUser.uid
  }));
  newUnits.forEach(u => batch.set(db.collection('units').doc(), u));
  // log transaction
  batch.set(db.collection('transactions').doc(), {
    type: 'in', itemId, itemName: item.name,
    qty: newUnits.length,
    sn: newUnits.map(u=>u.sn).filter(Boolean).join(', '),
    userId: currentUser.uid, userEmail: currentUser.email, userName: currentUser.displayName,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(), source:'manual'
  });
  await batch.commit();
  // add to local state
  const snap = await db.collection('units').where('itemId','==',itemId).get();
  const freshUnits = snap.docs.map(d=>({docId:d.id,...d.data()}));
  allUnits = allUnits.filter(u=>u.itemId!==itemId).concat(freshUnits);
  closeModal();
  showNotif(`เพิ่ม ${newUnits.length} ชิ้นสำเร็จ`);
  renderStockTab();
}

let qrSelectedUnits = [];
function updateQRScanSelection() {
  qrSelectedUnits = [...document.querySelectorAll('.unit-pick-cb:checked')].map(c=>c.value);
}

function simulateScan() {
  if (scanStep!==0) return;
  scanStep=1; renderQRTab();
  setTimeout(()=>{ scannedItem=allItems[Math.floor(Math.random()*allItems.length)]; scanStep=2; renderQRTab(); },1400);
}
function quickScanSelect(id) { if(!id)return; scannedItem=allItems.find(i=>i.id===id); scanStep=2; qrSelectedUnits=[]; renderQRTab(); }
function setScanOp(op) { scanOp=op; qrSelectedUnits=[]; renderQRTab(); }
function resetScan() { scanStep=0; scannedItem=null; qrSelectedUnits=[]; renderQRTab(); }

async function doQROp() {
  if (!scannedItem||scanOp!=='out') return;
  updateQRScanSelection();
  if (qrSelectedUnits.length===0) { showNotif('เลือกอย่างน้อย 1 ชิ้น','error'); return; }
  const usedAt = document.getElementById('qrUsedAt')?.value||'';
  const note = document.getElementById('qrNote')?.value||'';
  const serviceNo = genServiceNo();
  const batch = db.batch();
  qrSelectedUnits.forEach(uid => {
    batch.update(db.collection('units').doc(uid), {
      status:'used', usedAtLabel:usedAt, usedAt:firebase.firestore.FieldValue.serverTimestamp(),
      usedBy:currentUser.displayName, usedTxId:serviceNo
    });
    const u = allUnits.find(x=>x.docId===uid);
    batch.set(db.collection('transactions').doc(), {
      type:'out', serviceNo, itemId:scannedItem.id, itemName:scannedItem.name,
      qty:1, sn:u?.sn||'', unitId:uid, usedAt,
      note, source:'qr_scan',
      userId:currentUser.uid, userEmail:currentUser.email, userName:currentUser.displayName,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  });
  await batch.commit();
  qrSelectedUnits.forEach(uid => {
    const u = allUnits.find(x=>x.docId===uid);
    if (u) { u.status='used'; u.usedAtLabel=usedAt; }
  });
  showNotif(`เบิก ${qrSelectedUnits.length} ชิ้นสำเร็จ`);
  resetScan();
}

function addCheckedWithdrawUnits() {
  const checked = document.querySelectorAll('.unit-pick-cb:checked');
  if (checked.length===0) { showNotif('กรุณาเลือกอย่างน้อย 1 ชิ้น','error'); return; }
  checked.forEach(cb => {
    if (!withdrawUnits.find(w=>w.unitId===cb.value)) {
      withdrawUnits.push({ unitId:cb.value, itemId:cb.dataset.item, itemName:cb.dataset.name, sn:cb.dataset.sn, detail:cb.dataset.detail });
    }
  });
  renderWithdrawTab();
}

function removeWithdrawUnit(idx) { withdrawUnits.splice(idx,1); renderWithdrawTab(); }

async function submitWithdraw() {
  if (withdrawUnits.length===0) return;
  const reqBy = document.getElementById('wReqBy')?.value||'';
  const dept = document.getElementById('wDept')?.value||'';
  const usedAt = document.getElementById('wUsedAt')?.value||'';
  const hasService = document.getElementById('wHasService')?.value||'no';
  const serviceRef = document.getElementById('wServiceRef')?.value||'';
  const note = document.getElementById('wNote')?.value||'';
  if (!usedAt) { showNotif('กรุณาระบุสถานที่ใช้งาน','error'); return; }

  try {
    const batch = db.batch();
    withdrawUnits.forEach(w => {
      batch.update(db.collection('units').doc(w.unitId), {
        status:'used', usedAtLabel:usedAt, usedTxId:currentServiceNo,
        usedAt:firebase.firestore.FieldValue.serverTimestamp(),
        usedBy:currentUser.displayName
      });
      batch.set(db.collection('transactions').doc(), {
        type:'out', serviceNo:currentServiceNo,
        itemId:w.itemId, itemName:w.itemName, qty:1,
        sn:w.sn, unitId:w.unitId, detail:w.detail,
        usedAt, dept, reqBy, hasService, serviceRef, note,
        userId:currentUser.uid, userEmail:currentUser.email, userName:currentUser.displayName,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    await batch.commit();
    withdrawUnits.forEach(w => {
      const u = allUnits.find(x=>x.docId===w.unitId);
      if (u) { u.status='used'; u.usedAtLabel=usedAt; }
    });
    showNotif(`เบิกสำเร็จ ${withdrawUnits.length} ชิ้น — ${currentServiceNo}`);
    const lastUnits=[...withdrawUnits];
    const lastInfo={reqBy,dept,usedAt,hasService,serviceRef,note,serviceNo:currentServiceNo};
    withdrawUnits=[]; currentServiceNo=genServiceNo();
    renderWithdrawTab();
    if (confirm('เบิกสำเร็จ! ต้องการพิมพ์ใบเบิกหรือไม่?')) doPrint(lastUnits, lastInfo);
  } catch(e) { showNotif(e.message,'error'); }
}

function printWithdraw() {
  doPrint(withdrawUnits, {
    reqBy:document.getElementById('wReqBy')?.value||'',
    dept:document.getElementById('wDept')?.value||'',
    usedAt:document.getElementById('wUsedAt')?.value||'',
    hasService:document.getElementById('wHasService')?.value||'no',
    serviceRef:document.getElementById('wServiceRef')?.value||'',
    note:document.getElementById('wNote')?.value||'',
    serviceNo:currentServiceNo
  });
}

// USERS TAB

let allUsers = [];
async function renderUsersTab() {
  document.getElementById('mainContent').innerHTML = `
  <div class="flex justify-between items-center section-gap">
    <div style="font-size:15px;font-weight:600">👥 จัดการผู้ใช้งาน</div>
    <div style="font-size:12px;color:var(--text-3)">เปลี่ยนสิทธิ์จะมีผลเมื่อ User ล็อกอินใหม่</div>
  </div>
  <div class="card" id="usersCard"><div style="padding:2rem;text-align:center;color:var(--text-3)">กำลังโหลด...</div></div>`;
  try {
    const snap = await db.collection('users').orderBy('createdAt','desc').get();
    allUsers = snap.docs.map(d=>({docId:d.id,...d.data()}));
    renderUsersTable();
  } catch(e) {
    document.getElementById('usersCard').innerHTML=`<div style="padding:2rem;text-align:center;color:var(--red)">โหลดไม่สำเร็จ: ${e.message}</div>`;
  }
}
function renderUsersTable() {
  document.getElementById('usersCard').innerHTML = `
  <div class="table-wrap">
    <table>
      <tr><th>ผู้ใช้</th><th style="width:180px">Email</th><th style="width:120px">สิทธิ์</th><th style="width:150px">เปลี่ยนสิทธิ์</th><th style="width:130px">วันที่สมัคร</th></tr>
      ${allUsers.map(u=>{
        const isMe=u.docId===currentUser?.uid;
        return `<tr ${isMe?'style="background:#FFFDE7"':''}>
          <td>
            <div style="display:flex;align-items:center;gap:10px">
              ${u.photoURL?`<img src="${u.photoURL}" class="user-row-avatar" onerror="this.style.display='none'"/>`:`<span class="user-row-avatar">${(u.displayName||u.email||'U')[0].toUpperCase()}</span>`}
              <div>
                <div style="font-weight:600;font-size:13px">${u.displayName||'(ไม่มีชื่อ)'}${isMe?' <span style="font-size:11px;color:var(--green-dark);background:var(--green-light);padding:1px 6px;border-radius:10px">คุณ</span>':''}</div>
                <div style="font-size:11px;color:var(--text-3)">${u.docId}</div>
              </div>
            </div>
          </td>
          <td style="font-size:12px;color:var(--text-2)">${u.email||'-'}</td>
          <td><span class="badge ${u.role==='admin'?'badge-admin':'badge-user'}">${u.role==='admin'?'🔑 Admin':'👤 User'}</span></td>
          <td>${isMe?`<span style="font-size:12px;color:var(--text-3)">ไม่สามารถเปลี่ยนตัวเองได้</span>`:`<select class="role-select" onchange="changeUserRole('${u.docId}',this.value,this)"><option value="user" ${u.role!=='admin'?'selected':''}>👤 User</option><option value="admin" ${u.role==='admin'?'selected':''}>🔑 Admin</option></select>`}</td>
          <td style="font-size:12px;color:var(--text-3)">${formatDT(u.createdAt)}</td>
        </tr>`;
      }).join('')}
    </table>
  </div>
  <div style="padding:12px 16px;background:#FAFAFA;border-top:1px solid var(--border);font-size:12px;color:var(--text-3)">
    รวม ${allUsers.length} บัญชี · Admin ${allUsers.filter(u=>u.role==='admin').length} · User ${allUsers.filter(u=>u.role!=='admin').length}
  </div>`;
}

async function changeUserRole(uid, newRole, selectEl) {
  const user = allUsers.find(u=>u.docId===uid);
  if (!user) return;
  const oldRole = user.role||'user';
  if (oldRole===newRole) return;
  if (!confirm(`เปลี่ยนสิทธิ์ "${user.displayName||user.email}" เป็น ${newRole}?`)) { selectEl.value=oldRole; return; }
  try {
    await db.collection('users').doc(uid).update({ role:newRole });
    user.role=newRole;
    showNotif(`เปลี่ยนสิทธิ์สำเร็จ`);
    renderUsersTable();
  } catch(e) { showNotif('ไม่สำเร็จ: '+e.message,'error'); selectEl.value=oldRole; }
}

// ============================================================
// MODAL
// ============================================================
function showModal(html, xl=false) {
  const div = document.createElement('div');
  div.className='modal-overlay'; div.id='modalOverlay';
  div.innerHTML=`<div class="modal ${xl?'modal-xl':'modal-lg'}">${html}</div>`;
  div.addEventListener('click',e=>{ if(e.target===div) closeModal(); });
  document.body.appendChild(div);
}
function closeModal() { const m=document.getElementById('modalOverlay'); if(m) m.remove(); }

// ============================================================
// NOTIF
// ============================================================
function showNotif(msg, type='ok') {
  const n=document.getElementById('notif');
  n.textContent=msg;
  n.className='notif show'+(type==='error'?' error':'');
  setTimeout(()=>n.className='notif',2800);
}
