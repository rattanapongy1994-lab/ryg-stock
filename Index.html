<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RYG Stock System</title>

<!-- Firebase SDK v10 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root {
    --green: #1D9E75; --green-dark: #0F6E56; --green-light: #E1F5EE;
    --blue: #185FA5; --blue-light: #E6F1FB;
    --amber: #854F0B; --amber-light: #FAEEDA;
    --red: #A32D2D; --red-light: #FCEBEB;
    --bg: #F4F6F9; --surface: #fff;
    --border: rgba(0,0,0,0.1); --border-md: rgba(0,0,0,0.18);
    --text: #1a1a1a; --text-2: #555; --text-3: #888;
    --radius: 8px; --radius-lg: 12px;
    --font: 'Sarabun', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; }

  /* ========== LOGIN ========== */
  #loginScreen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0F6E56 0%, #1D9E75 50%, #5DCAA5 100%);
  }
  .login-card {
    background: var(--surface); border-radius: 16px; padding: 2.5rem;
    width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 2rem; }
  .logo-icon {
    width: 48px; height: 48px; background: var(--green); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 24px;
  }
  .login-card h1 { font-size: 20px; font-weight: 700; }
  .login-card p { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .btn-google {
    width: 100%; padding: 12px; border: 1.5px solid var(--border-md); border-radius: var(--radius);
    background: var(--surface); cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 10px; font-size: 14px; font-weight: 500; color: var(--text);
    transition: background .15s;
  }
  .btn-google:hover { background: #f5f5f5; }
  .google-icon { width: 20px; height: 20px; }
  .login-note { font-size: 12px; color: var(--text-3); text-align: center; margin-top: 1rem; }

  /* ========== LAYOUT ========== */
  #mainApp { display: none; flex-direction: column; min-height: 100vh; }
  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 1.5rem; height: 56px; display: flex; align-items: center;
    justify-content: space-between; position: sticky; top: 0; z-index: 50;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-logo {
    width: 32px; height: 32px; background: var(--green); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .topbar-title { font-size: 16px; font-weight: 700; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .user-chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border-radius: 20px; padding: 4px 12px 4px 4px;
  }
  .user-avatar {
    width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
    background: var(--green-light); display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 700; color: var(--green-dark);
  }
  .user-name { font-size: 13px; font-weight: 500; }
  .badge-role {
    padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700;
  }
  .badge-admin { background: var(--green-light); color: var(--green-dark); }
  .badge-user { background: var(--blue-light); color: var(--blue); }
  .btn-logout {
    padding: 6px 14px; border: 1px solid var(--border-md); border-radius: var(--radius);
    background: transparent; cursor: pointer; font-size: 13px; color: var(--text-2);
  }
  .btn-logout:hover { background: var(--bg); }

  .nav-tabs {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 1.5rem; display: flex; gap: 0;
  }
  .nav-tab {
    padding: 12px 18px; font-size: 13px; color: var(--text-2); cursor: pointer;
    border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .nav-tab.active { color: var(--green); border-bottom-color: var(--green); font-weight: 600; }
  .nav-tab:hover:not(.active) { color: var(--text); }

  .content { padding: 1.5rem; flex: 1; }

  /* ========== CARDS ========== */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 1.25rem;
  }
  .stat-label { font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
  .stat-value { font-size: 26px; font-weight: 700; }
  .stat-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); overflow: hidden;
  }
  .card-header {
    padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-title { font-size: 14px; font-weight: 600; }

  /* ========== TABLE ========== */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th {
    padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600;
    color: var(--text-3); background: #FAFAFA; border-bottom: 1px solid var(--border);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #FAFAFA; }

  /* ========== BADGES ========== */
  .badge { display: inline-flex; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-ok { background: var(--green-light); color: var(--green-dark); }
  .badge-low { background: var(--amber-light); color: var(--amber); }
  .badge-out { background: var(--red-light); color: var(--red); }
  .badge-in { background: var(--green-light); color: var(--green-dark); }
  .badge-out2 { background: var(--red-light); color: var(--red); }

  /* ========== BUTTONS ========== */
  .btn { padding: 7px 14px; border-radius: var(--radius); font-size: 13px; cursor: pointer; border: 1px solid var(--border-md); background: var(--surface); color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--bg); }
  .btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-danger { background: var(--red-light); color: var(--red); border-color: #F09595; }
  .btn-icon { padding: 5px 8px; border-radius: 6px; }

  /* ========== FORM ========== */
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 8px 12px; border: 1px solid var(--border-md);
    border-radius: var(--radius); font-size: 13px; font-family: var(--font);
    background: var(--surface); color: var(--text);
  }
  .field textarea { resize: vertical; min-height: 72px; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--green);
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ========== MODAL ========== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center; z-index: 200;
  }
  .modal {
    background: var(--surface); border-radius: 14px; padding: 1.75rem;
    width: 520px; max-width: 95vw; max-height: 90vh; overflow-y: auto;
  }
  .modal-lg { width: 680px; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 1.25rem; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); }

  /* ========== QR ========== */
  .qr-panel {
    max-width: 520px; margin: 0 auto;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 2rem;
  }
  .qr-box {
    width: 200px; height: 200px; border: 2px dashed var(--border-md);
    border-radius: var(--radius-lg); margin: 1.5rem auto;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; cursor: pointer; color: var(--text-3);
    font-size: 13px; overflow: hidden; position: relative;
  }
  .qr-box:hover { border-color: var(--green); color: var(--green); }
  .scan-line {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--green); animation: scanAnim 1.8s ease-in-out infinite;
  }
  @keyframes scanAnim { 0%{top:0} 50%{top:calc(100% - 3px)} 100%{top:0} }
  .qr-result {
    background: var(--bg); border-radius: var(--radius);
    padding: 1rem 1.25rem; margin: 1rem 0;
  }
  .result-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .result-label { font-size: 12px; color: var(--text-3); }
  .result-value { font-size: 13px; font-weight: 600; }
  .op-tabs { display: flex; gap: 8px; margin: 1rem 0; }
  .op-tab {
    flex: 1; padding: 10px; border: 1px solid var(--border-md);
    border-radius: var(--radius); cursor: pointer; font-size: 13px;
    font-weight: 500; text-align: center; color: var(--text-2); background: var(--bg);
  }
  .op-tab.active { background: var(--green); border-color: var(--green); color: #fff; }
  .qty-row { display: flex; align-items: center; gap: 10px; margin: 1rem 0; }
  .qty-btn {
    width: 36px; height: 36px; border: 1px solid var(--border-md); border-radius: var(--radius);
    background: var(--bg); cursor: pointer; font-size: 20px; font-weight: 300;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-input {
    width: 70px; text-align: center; padding: 8px; border: 1px solid var(--border-md);
    border-radius: var(--radius); font-size: 16px; font-weight: 700;
  }

  /* ========== HISTORY ========== */
  .hist-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* ========== SERVICE FORM ========== */
  .service-ref {
    background: var(--green-light); border-radius: var(--radius);
    padding: 10px 14px; margin-bottom: 1rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .service-ref-label { font-size: 12px; color: var(--green-dark); }
  .service-ref-no { font-size: 18px; font-weight: 700; color: var(--green-dark); font-family: monospace; }

  /* ========== PRINT ========== */
  @media print {
    #mainApp, .topbar, .nav-tabs, .content { display: none !important; }
    #printArea { display: block !important; }
  }
  #printArea { display: none; }
  .print-doc {
    max-width: 750px; margin: 0 auto; padding: 2rem; font-family: 'Sarabun', sans-serif;
  }
  .print-header { text-align: center; margin-bottom: 1.5rem; border-bottom: 2px solid #000; padding-bottom: 1rem; }
  .print-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .print-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 1rem 0; }
  .print-meta-item { }
  .print-meta-label { font-size: 11px; color: #666; }
  .print-meta-value { font-size: 13px; font-weight: 600; }
  .print-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  .print-table th, .print-table td { border: 1px solid #ccc; padding: 8px 10px; font-size: 13px; }
  .print-table th { background: #f0f0f0; font-weight: 700; }
  .print-sign { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 3rem; }
  .sign-box { text-align: center; }
  .sign-line { border-top: 1px solid #000; margin-top: 3rem; padding-top: 6px; font-size: 12px; }

  /* ========== NOTIF ========== */
  #notif {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--green); color: #fff; padding: 12px 20px;
    border-radius: var(--radius); font-size: 13px; font-weight: 500;
    opacity: 0; transition: opacity .3s; z-index: 999; pointer-events: none;
  }
  #notif.show { opacity: 1; }
  #notif.error { background: var(--red); }

  /* ========== LOADING ========== */
  #loadingScreen {
    position: fixed; inset: 0; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
  }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--green-light);
    border-top-color: var(--green); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ========== UTILS ========== */
  .search-bar { display: flex; gap: 8px; align-items: center; }
  .search-input {
    padding: 7px 12px; border: 1px solid var(--border-md); border-radius: var(--radius);
    font-size: 13px; width: 220px; background: var(--surface); color: var(--text);
  }
  .bar-bg { background: #E5E7EB; border-radius: 4px; height: 7px; }
  .bar-fill { background: var(--green); height: 7px; border-radius: 4px; transition: width .4s; }
  .section-gap { margin-bottom: 1.5rem; }
  .flex { display: flex; }
  .gap8 { gap: 8px; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .text-sm { font-size: 12px; }
  .text-muted { color: var(--text-3); }
  .mono { font-family: monospace; }
  .fw600 { font-weight: 600; }
</style>
</head>
<body>

<!-- LOADING -->
<div id="loadingScreen">
  <div style="width:48px;height:48px;background:var(--green);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:1rem;">📦</div>
  <div style="font-size:16px;font-weight:600;margin-bottom:1rem;">RYG Stock System</div>
  <div class="spinner"></div>
</div>

<!-- LOGIN -->
<div id="loginScreen" style="display:none;">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">📦</div>
      <div>
        <h1>RYG Stock System</h1>
        <p>ระบบจัดการสต็อก Spare Part</p>
      </div>
    </div>
    <button class="btn-google" onclick="signInGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      เข้าสู่ระบบด้วย Google
    </button>
    <div class="login-note">ระบบจะตรวจสอบสิทธิ์จาก Email ที่กำหนดไว้ใน Firestore<br>Admin ต้องได้รับการอนุมัติจากผู้ดูแลระบบ</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">📦</div>
      <span class="topbar-title">RYG Stock System</span>
    </div>
    <div class="topbar-right">
      <div class="user-chip">
        <img id="userAvatar" class="user-avatar" src="" onerror="this.style.display='none'" alt=""/>
        <span id="userAvatarFallback" class="user-avatar"></span>
        <span id="userDisplayName" class="user-name"></span>
      </div>
      <span id="roleLabel" class="badge-role badge-admin">Admin</span>
      <button class="btn-logout" onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </div>
  <div class="nav-tabs" id="navTabs">
    <div class="nav-tab active" id="nav-dashboard" onclick="showTab('dashboard')">📊 Dashboard</div>
    <div class="nav-tab" id="nav-stock" onclick="showTab('stock')">📦 สต็อกสินค้า</div>
    <div class="nav-tab" id="nav-qr" onclick="showTab('qr')">📷 สแกน QR</div>
    <div class="nav-tab" id="nav-withdraw" onclick="showTab('withdraw')">📤 เบิกสินค้า</div>
    <div class="nav-tab" id="nav-history" onclick="showTab('history')">🕐 ประวัติ</div>
  </div>
  <div class="content" id="mainContent">
    <div style="text-align:center;padding:3rem;color:var(--text-3);">กำลังโหลด...</div>
  </div>
</div>

<!-- PRINT AREA -->
<div id="printArea"></div>

<div id="notif"></div>

<script>
// ============================================================
// 🔧 FIREBASE CONFIG — แก้ไขตรงนี้ด้วย config จาก Firebase Console
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyABKbRCDNh5SHwvbuFtAudLnRYepZfXk7s",
  authDomain: "ryg-stock.firebaseapp.com",
  projectId: "ryg-stock",
  storageBucket: "ryg-stock.firebasestorage.app",
  messagingSenderId: "338213551131",
  appId: "1:338213551131:web:153773df4f8111b2364cbe",
  measurementId: "G-ZG4Z0T6S7H"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ============================================================
// STATE
// ============================================================
let currentUser = null;
let currentRole = 'user';
let currentTab = 'dashboard';
let allItems = [];
let searchQ = '';
let scanStep = 0, scanOp = 'out', scanQty = 1, scannedItem = null;
let withdrawItems = [];
let currentServiceNo = '';

// ============================================================
// AUTH
// ============================================================
auth.onAuthStateChanged(async (user) => {
  document.getElementById('loadingScreen').style.display = 'none';
  if (!user) {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
    return;
  }
  currentUser = user;
  await loadUserRole(user);
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'flex';
  updateUserUI();
  await loadItems();
  showTab('dashboard');
  subscribeHistory();
});

async function loadUserRole(user) {
  try {
    const doc = await db.collection('users').doc(user.uid).get();
    if (doc.exists) {
      currentRole = doc.data().role || 'user';
    } else {
      // สร้าง user record ใหม่ — default เป็น user
      await db.collection('users').doc(user.uid).set({
        email: user.email,
        displayName: user.displayName,
        photoURL: user.photoURL,
        role: 'user',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      currentRole = 'user';
    }
  } catch(e) {
    console.error(e);
    currentRole = 'user';
  }
}

function updateUserUI() {
  document.getElementById('userDisplayName').textContent = currentUser.displayName || currentUser.email;
  const avatar = document.getElementById('userAvatar');
  const fallback = document.getElementById('userAvatarFallback');
  if (currentUser.photoURL) {
    avatar.src = currentUser.photoURL;
    avatar.style.display = '';
    fallback.style.display = 'none';
  } else {
    avatar.style.display = 'none';
    fallback.style.display = '';
    fallback.textContent = (currentUser.displayName || currentUser.email || 'U')[0].toUpperCase();
  }
  const rl = document.getElementById('roleLabel');
  rl.textContent = currentRole === 'admin' ? 'Admin' : 'User';
  rl.className = 'badge-role ' + (currentRole === 'admin' ? 'badge-admin' : 'badge-user');
}

function signInGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e => showNotif(e.message, 'error'));
}

function doLogout() {
  auth.signOut();
}

// ============================================================
// FIRESTORE — ITEMS
// ============================================================
async function loadItems() {
  const snap = await db.collection('items').orderBy('id').get();
  allItems = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
  // Seed ถ้าว่างเปล่า
  if (allItems.length === 0) await seedItems();
}

async function seedItems() {
  const seed = [
    {id:'SP001',name:'SSD (128GB)',qty:3,min:2,loc:'ชั้นเก็บของ IT',cat:'Storage'},
    {id:'SP002',name:'SSD (240GB)',qty:1,min:2,loc:'ชั้นเก็บของ IT',cat:'Storage'},
    {id:'SP003',name:'HDD 320GB',qty:1,min:1,loc:'ชั้นเก็บของ IT',cat:'Storage'},

// HISTORY real-time subscription
// ============================================================
let historyData = [];
let historyUnsub = null;

function subscribeHistory() {
  if (historyUnsub) historyUnsub();
  historyUnsub = db.collection('transactions')
    .orderBy('createdAt', 'desc')
    .limit(200)
    .onSnapshot(snap => {
      historyData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (currentTab === 'history') renderHistoryTab();
      if (currentTab === 'dashboard') renderDashboardTab();
    });
}

// ============================================================
// TAB ROUTING
// ============================================================
function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  const navEl = document.getElementById('nav-' + tab);
  if (navEl) navEl.classList.add('active');
  const c = document.getElementById('mainContent');
  if (tab === 'dashboard') renderDashboardTab();
  else if (tab === 'stock') renderStockTab();
  else if (tab === 'qr') renderQRTab();
  else if (tab === 'withdraw') renderWithdrawTab();
  else if (tab === 'history') renderHistoryTab();
}

// ============================================================
// STATUS HELPERS
// ============================================================
function getStatus(item) {
  if (item.qty <= 0) return 'out';
  if (item.qty <= item.min) return 'low';
  return 'ok';
}
function statusBadge(item) {
  const s = getStatus(item);
  if (s === 'out') return '<span class="badge badge-out">หมดสต็อก</span>';
  if (s === 'low') return '<span class="badge badge-low">ใกล้หมด</span>';
  return '<span class="badge badge-ok">ปกติ</span>';
}
function formatDT(ts) {
  if (!ts) return '-';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('th-TH', { day:'2-digit', month:'2-digit', year:'numeric' })
    + ' ' + d.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
}
function todayStr() {
  return new Date().toLocaleDateString('th-TH', { day:'2-digit', month:'2-digit', year:'numeric' });
}

      <div class="op-tab ${scanOp==='in'?'active':''}" onclick="setScanOp('in')">📥 นำเข้า</div>
    </div>
    <div class="qty-row">
      <span style="font-size:13px;color:var(--text-2)">จำนวน:</span>
      <button class="qty-btn" onclick="chgScanQty(-1)">−</button>
      <input class="qty-input" type="number" min="1" value="${scanQty}"
        onchange="scanQty=Math.max(1,parseInt(this.value)||1);renderQRTab()"/>
      <button class="qty-btn" onclick="chgScanQty(1)">+</button>
    </div>
    <div class="field"><label>หมายเหตุ (ถ้ามี)</label><input id="qrNote" placeholder="ระบุรายละเอียด..."/></div>

    </button>
    ` : ''}

    ` : ''}
  </div>`;
}

function simulateScan() {
  if (scanStep !== 0) return;
  scanStep = 1;
  renderQRTab();
  setTimeout(() => {
    scannedItem = allItems[Math.floor(Math.random() * allItems.length)];
    scanStep = 2; scanQty = 1;
    renderQRTab();
  }, 1400);
}
function quickScanSelect(id) {
  if (!id) return;
  scannedItem = allItems.find(i => i.id === id);
  scanStep = 2; scanQty = 1;
  renderQRTab();
}
function setScanOp(op) { scanOp = op; renderQRTab(); }
function chgScanQty(d) { scanQty = Math.max(1, scanQty + d); renderQRTab(); }
function resetScan() { scanStep = 0; scannedItem = null; scanQty = 1; renderQRTab(); }

async function doQROp() {
  if (!scannedItem) return;
  const note = document.getElementById('qrNote')?.value || '';
  if (scanOp === 'out' && scannedItem.qty < scanQty) {
    showNotif('สต็อกไม่เพียงพอ!', 'error'); return;
  }
  await doTransaction({
    type: scanOp,
    itemId: scannedItem.id,
    itemName: scannedItem.name,
    qty: scanQty,
    note,
    source: 'qr_scan'
  });
  resetScan();
}

function genServiceNo() {
  const d = new Date();
  return 'WD-' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') +
    String(d.getDate()).padStart(2,'0') + '-' + String(Math.floor(Math.random()*9000)+1000);
}

function addWithdrawItem() {
  const sel = document.getElementById('wItemSel');
  const qty = parseInt(document.getElementById('wQtyIn').value) || 1;
  const id = sel.value;
  if (!id) { showNotif('กรุณาเลือกสินค้า', 'error'); return; }
  const item = allItems.find(i => i.id === id);
  if (!item) return;
  const existing = withdrawItems.find(w => w.id === id);
  const totalQty = (existing ? existing.qty : 0) + qty;
  if (totalQty > item.qty) { showNotif(`สต็อกไม่พอ (มีแค่ ${item.qty} ชิ้น)`, 'error'); return; }
  if (existing) existing.qty = totalQty;
  else withdrawItems.push({ id: item.id, name: item.name, qty });
  renderWithdrawTab();
}

function removeWithdrawItem(idx) {
  withdrawItems.splice(idx, 1);
  renderWithdrawTab();
}

async function submitWithdraw() {
  if (withdrawItems.length === 0) return;
  const reqBy = document.getElementById('wReqBy')?.value || currentUser?.displayName || '';
  const dept = document.getElementById('wDept')?.value || '';
  const usedAt = document.getElementById('wUsedAt')?.value || '';
  const hasService = document.getElementById('wHasService')?.value || 'no';
  const serviceRef = document.getElementById('wServiceRef')?.value || '';
  const note = document.getElementById('wNote')?.value || '';

  if (!usedAt) { showNotif('กรุณาระบุสถานที่ใช้งาน', 'error'); return; }

  try {
    const batch = db.batch();
    const txns = [];

    for (const w of withdrawItems) {
      const item = allItems.find(i => i.id === w.id);
      if (!item || item.qty < w.qty) {
        showNotif(`${w.name}: สต็อกไม่พอ!`, 'error'); return;
      }
      // Update stock
      const itemRef = db.collection('items').doc(w.id);
      batch.update(itemRef, { qty: item.qty - w.qty });

      // Transaction record
      const txRef = db.collection('transactions').doc();
      const txData = {
        type: 'out',
        serviceNo: currentServiceNo,
        itemId: w.id,
        itemName: w.name,
        qty: w.qty,
        usedAt,
        dept,
        reqBy,
        hasService,
        serviceRef,
        note,
        userId: currentUser.uid,
        userEmail: currentUser.email,
        userName: currentUser.displayName,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      batch.set(txRef, txData);
      txns.push(txData);
    }

    await batch.commit();

    // Update local state
    withdrawItems.forEach(w => {
      const item = allItems.find(i => i.id === w.id);
      if (item) item.qty -= w.qty;
    });

    showNotif(`เบิกสำเร็จ ${withdrawItems.length} รายการ — ${currentServiceNo}`);
    const lastItems = [...withdrawItems];
    const lastInfo = { reqBy, dept, usedAt, hasService, serviceRef, note, serviceNo: currentServiceNo };
    withdrawItems = [];
    const oldNo = currentServiceNo;
    currentServiceNo = genServiceNo();
    renderWithdrawTab();

    // Auto-print prompt
    if (confirm('เบิกสำเร็จ! ต้องการพิมพ์ใบเบิกหรือไม่?')) {
      doPrint(lastItems, lastInfo);
    }
  } catch(e) {
    showNotif(e.message, 'error');
  }
}

function printWithdraw() {
  const reqBy = document.getElementById('wReqBy')?.value || '';
  const dept = document.getElementById('wDept')?.value || '';
  const usedAt = document.getElementById('wUsedAt')?.value || '';
  const hasService = document.getElementById('wHasService')?.value || 'no';
  const serviceRef = document.getElementById('wServiceRef')?.value || '';
  const note = document.getElementById('wNote')?.value || '';
  doPrint(withdrawItems, { reqBy, dept, usedAt, hasService, serviceRef, note, serviceNo: currentServiceNo });
}

async function doAddItem() {
  const id = document.getElementById('mId').value.trim().toUpperCase();
  const name = document.getElementById('mName').value.trim();
  const cat = document.getElementById('mCat').value.trim();
  if (!id || !name) { showNotif('กรุณากรอกข้อมูลให้ครบ', 'error'); return; }
  if (allItems.find(i => i.id === id)) { showNotif('รหัสสินค้าซ้ำ!', 'error'); return; }
  const data = { id, name, cat: cat||'Other', qty: parseInt(document.getElementById('mQty').value)||0,
    min: parseInt(document.getElementById('mMin').value)||1, loc: document.getElementById('mLoc').value };
  await db.collection('items').doc(id).set(data);
  allItems.push({ docId: id, ...data });
  allItems.sort((a,b) => a.id.localeCompare(b.id));
  closeModal();
  showNotif('เพิ่มสินค้าสำเร็จ');
  renderStockTab();
}

  const item = allItems.find(i => i.id === id);

async function doAdjItem(id, op) {
  const item = allItems.find(i => i.id === id);
  const qty = parseInt(document.getElementById('adjQ').value) || 1;
  const usedAt = document.getElementById('adjUsedAt').value;
  const hasService = document.getElementById('adjSvc').value;
  const serviceRef = document.getElementById('adjSvcRef').value;
  const note = document.getElementById('adjNote').value;
  if (op === 'out' && item.qty < qty) { showNotif('สต็อกไม่เพียงพอ!', 'error'); return; }
  await doTransaction({ type: op, itemId: id, itemName: item.name, qty, usedAt, hasService, serviceRef, note, source: 'manual' });
  closeModal();
}

// ============================================================
// TRANSACTION HELPER
// ============================================================
async function doTransaction(data) {
  const item = allItems.find(i => i.id === data.itemId);
  if (!item) return;
  const newQty = data.type === 'in' ? item.qty + data.qty : item.qty - data.qty;
  const batch = db.batch();
  batch.update(db.collection('items').doc(data.itemId), { qty: newQty });
  batch.set(db.collection('transactions').doc(), {
    ...data,
    serviceNo: data.serviceNo || genServiceNo(),
    userId: currentUser.uid,
    userEmail: currentUser.email,
    userName: currentUser.displayName,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  await batch.commit();
  item.qty = newQty;
  showNotif(data.type === 'in' ? `นำเข้า ${data.qty} ชิ้นสำเร็จ` : `เบิก ${data.qty} ชิ้นสำเร็จ`);
  if (currentTab === 'stock') renderStockTab();
  if (currentTab === 'dashboard') renderDashboardTab();
}

// ============================================================
// MODAL
// ============================================================
function showModal(html) {
  const div = document.createElement('div');
  div.className = 'modal-overlay';
  div.id = 'modalOverlay';
  div.innerHTML = `<div class="modal modal-lg">${html}</div>`;
  div.addEventListener('click', e => { if (e.target === div) closeModal(); });
  document.body.appendChild(div);
}
function closeModal() {
  const m = document.getElementById('modalOverlay');
  if (m) m.remove();
}

// ============================================================
// NOTIF
// ============================================================
function showNotif(msg, type = 'ok') {
  const n = document.getElementById('notif');
  n.textContent = msg;
  n.className = 'notif show' + (type === 'error' ? ' error' : '');
  setTimeout(() => n.className = 'notif', 2800);
}
